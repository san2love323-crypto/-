 <div class="card race" id="rcTrack"><div class="lane"><div class="car" id="car1" style="background:var(--p1)">P1</div><div class="goal"></div></div><div class="lane"><div class="car" id="car2" style="background:var(--p2)">P2</div><div class="goal"></div></div></div>
 <div id="rcArena"></div>
 <div class="card"><div class="eyebrow">명예의 전당 (이 기기)</div>${lb.length?`<table style="margin-top:6px"><tr><th>이름</th><th>학년</th><th class="tright">걸린 시간</th><th class="tright">정확도</th></tr>${lb.slice(0,8).map(r=>`<tr><td>${r.n}</td><td>${r.g}</td><td class="tright num">${r.t}초</td><td class="tright num">${r.acc}%</td></tr>`).join('')}</table>`:'<p style="font-size:13px;color:var(--muted)">아직 기록이 없습니다.</p>'}<div class="row" style="margin-top:8px"><button class="sm" id="lbClear">기록 지우기</button></div></div>`;
 $('#lbClear').onclick=()=>{store.set('lb',[]);renderRace(el)};
 $('#rcStart').onclick=startRace;
}
function startRace(){
 stopRace();const mode=$('#rcMode').value,diff=+$('#rcDiff').value,len=+$('#rcLen').value,pool=shuffle($('#rcPool').value==='g'?poolQuiz(G().id):QUIZ);
 race={mode,diff,len,pool,qi:0,p:[{pos:0,streak:0,ok:0,n:0,lock:0},{pos:0,streak:0,ok:0,n:0,lock:0}],t0:Date.now(),tLeft:15,iv:null,done:false,cur:null};
 race.iv=setInterval(tick,100);nextQ();
 document.onkeydown=e=>{if(!race||race.done)return;const k=e.key;const m1={'1':0,'2':1,'3':2,'4':3},m2={'7':0,'8':1,'9':2,'0':3};if(k in m1)answer(0,m1[k]);else if(race.mode==='2p'&&k in m2)answer(1,m2[k])};
}
function nextQ(){const q=race.pool[race.qi%race.pool.length];race.qi++;const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));race.cur={q,opts,start:Date.now(),answered:[false,false]};race.tLeft=15;
 if(race.mode==='cpu'){const delay=[9000,5500,3000][race.diff-1]+Math.random()*2000;const acc=[.5,.7,.88][race.diff-1];race.cpuT=setTimeout(()=>{if(!race||race.cur.q!==q)return;answer(1,Math.random()<acc?opts.findIndex(o=>o.ok):rnd(4),true)},delay)}
 drawArena()}
function drawArena(){const {q,opts}=race.cur;const side=(p,cls)=>`<div class="side ${cls}" id="side${p}"><div class="row between"><b style="color:var(--${cls})">${p===0?'P1':race.mode==='cpu'?'컴퓨터':'P2'}</b><span class="pill">${race.p[p].pos}/${race.len}칸 · 연속 ${race.p[p].streak}</span></div>${p===1&&race.mode==='cpu'?'<p style="font-size:13px;color:var(--muted);margin:8px 0 0">컴퓨터가 생각 중…</p>':`<div class="opts" style="margin-top:8px">${opts.map((o,i)=>`<button data-p="${p}" data-i="${i}">${p===0?i+1:[7,8,9,0][i]}. ${o.t}</button>`).join('')}</div>`}</div>`;
 $('#rcArena').innerHTML=`<div class="card"><div class="row between"><span class="eyebrow">문제 ${race.qi}</span><span class="pill num" id="rcT">15.0초</span></div><div class="q">${q.q}</div><div class="vs">${side(0,'p1')}${side(1,'p2')}</div></div>`;
 $$('#rcArena button').forEach(b=>b.onclick=()=>answer(+b.dataset.p,+b.dataset.i));moveCars()}
function moveCars(){[0,1].forEach(i=>{const lane=$('#car'+(i+1)).parentElement;const w=lane.clientWidth-90;$('#car'+(i+1)).style.left=Math.min(w,race.p[i].pos/race.len*w)+'px'})}
function answer(p,i,cpu){if(!race||race.done||race.cur.answered[p]||Date.now()<race.p[p].lock)return;const o=race.cur.opts[i];race.cur.answered[p]=true;const P=race.p[p];P.n++;
 const fast=(Date.now()-race.cur.start)<5000;
 if(o.ok){P.ok++;P.streak++;let adv=1+(fast?1:0);if(P.streak%3===0){adv+=1;toast((p===0?'P1':'P2')+' 부스터!')}P.pos=Math.min(race.len,P.pos+adv)}else{P.streak=0;P.lock=Date.now()+2000}
 if(!cpu){const btns=$$(`#side${p} button`);btns.forEach((b,j)=>{b.disabled=true;if(race.cur.opts[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('no')})}
 moveCars();
 if(P.pos>=race.len){finish(p);return}
 const both=race.cur.answered[0]&&race.cur.answered[1];if(both)setTimeout(()=>{if(race&&!race.done)nextQ()},900)}
function tick(){if(!race||race.done)return;race.tLeft=Math.max(0,15-(Date.now()-race.cur.start)/1000);const t=$('#rcT');if(t)t.textContent=race.tLeft.toFixed(1)+'초';if(race.tLeft<=0){race.cur.answered=[true,true];nextQ()}}
function finish(w){race.done=true;clearInterval(race.iv);clearTimeout(race.cpuT);const sec=((Date.now()-race.t0)/1000).toFixed(1);const P=race.p[w];const acc=P.n?Math.round(P.ok/P.n*100):0;const name=w===0?'P1':race.mode==='cpu'?'컴퓨터':'P2';logAct('레이스',G().name+' · '+U()[0]+' — '+(w===0?'승리':'패배'),race.p[0].n?Math.round(race.p[0].ok/race.p[0].n*100):null);
 $('#rcArena').innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">결승선 통과</div><h2 style="font-size:32px;margin:6px 0">${name} 승리! 🏁</h2><p class="num">${sec}초 · 정확도 ${acc}% · 문제 ${race.qi}개</p>
 ${w===0||race.mode==='2p'?`<div class="row" style="justify-content:center"><input type="text" id="lbName" placeholder="이름 (기록 저장)" maxlength="12"><button class="pri" id="lbSave">기록 저장</button></div>`:''}<div class="row" style="justify-content:center;margin-top:10px"><button id="rcAgain">다시 하기</button></div></div>`;
 const sv=$('#lbSave');if(sv)sv.onclick=()=>{const n=$('#lbName').value.trim()||name;const lb=store.get('lb',[]);lb.push({n,g:G().name,t:sec,acc});lb.sort((a,b)=>a.t-b.t);store.set('lb',lb.slice(0,20));toast('저장했습니다');renderRace($('#gameBody'))};
 $('#rcAgain').onclick=()=>{renderRace($('#gameBody'));startRace()}}

 ${recs.map(r=>`<div class="card"><h3 style="margin-bottom:8px">${r.g.name}</h3><div style="display:flex;flex-direction:column;gap:6px">${r.g.units.map((u,i)=>{const rc=r.units[i];return `<div class="row" style="gap:10px"><span style="flex:1;min-width:160px;font-size:13px">${i+1}. ${u[0]}</span><div class="bar" style="flex:2;min-width:120px"><i style="width:${rc.best||0}%"></i></div><span class="num" style="width:70px;text-align:right;font-size:13px;color:${rc.best==null?'var(--muted)':'var(--fg)'}">${rc.best==null?'미응시':rc.best+'점·'+rc.n+'회'}</span></div>`}).join('')}</div></div>`).join('')}
 <div class="card"><div class="row between"><h3>최근 모의시험</h3><button class="sm" id="stClear">기록 전체 삭제</button></div>${exams.length?`<table style="margin-top:6px"><tr><th>날짜</th><th>학년</th><th class="tright">문항</th><th class="tright">점수</th></tr>${exams.slice(-10).reverse().map(e=>`<tr><td>${e.d}</td><td>${e.g}</td><td class="tright num">${e.n}</td><td class="tright num">${e.s}</td></tr>`).join('')}</table>`:'<p style="font-size:13px;color:var(--muted)">아직 시험 기록이 없습니다.</p>'}</div>`;
 $('#stClear').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('hl.')&&!k.startsWith('hl.vid')&&k!=='hl.nav').forEach(k=>localStorage.removeItem(k))}catch(e){}renderStats();renderNav();toast('기록을 지웠습니다')};

function openSearch(){
 const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="box"><div class="row between"><b>🔎 단원 · 문제 · 용어 검색</b><button class="sm" id="sClose">✕</button></div><input type="text" id="sIn" placeholder="예: 대동법, 수요 법칙, 고려" style="margin-top:10px" autocomplete="off"><div class="sres" id="sRes"><p style="font-size:13px;color:var(--muted);margin:0;padding:6px 12px">단원, 퀴즈 문제, 학습 용어를 한 번에 찾습니다.</p></div></div>`;
 document.body.appendChild(ov);const close=()=>ov.remove();$('#sClose').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
 const inp=$('#sIn');inp.focus();inp.oninput=()=>{const q=inp.value.trim().toLowerCase();if(!q){return}let out=[];
  GRADES.forEach((g,gi)=>g.units.forEach((u,ui)=>{if(u[0].toLowerCase().includes(q))out.push(`<button data-g="${gi}" data-u="${ui}" data-m="sim"><span class="tag">단원</span>${g.name} · ${u[0]}</button>`)}));
  FACTS.filter(f=>f.t.includes(q)||f.d.includes(q)).slice(0,8).forEach(f=>out.push(`<button data-g="${GRADES.findIndex(g=>g.id===f.g)}" data-u="0" data-m="ws"><span class="tag">용어</span><span><b>${f.t}</b> — ${f.d}</span></button>`));
  QUIZ.filter(x=>x.q.includes(q)||x.o.some(o=>o.includes(q))).slice(0,8).forEach(x=>out.push(`<button data-g="${GRADES.findIndex(g=>g.id===x.g)}" data-u="0" data-m="quiz"><span class="tag">문제</span><span>${x.q}</span></button>`));
  $('#sRes').innerHTML=out.join('')||'<p style="font-size:13px;color:var(--muted);margin:0;padding:6px 12px">검색 결과가 없습니다.</p>';
  $$('#sRes button').forEach(b=>b.onclick=()=>{S.g=+b.dataset.g;S.u=+b.dataset.u;S.mod=b.dataset.m;close();go();window.scrollTo({top:0,behavior:'smooth'})})}}
/* ================= WORKSHEET ================= */
function genWS(n,types){const facts=shuffle(poolFacts(G().id)),qs=shuffle(poolQuiz(G().id)),all=shuffle(FACTS);const items=[];let fi=0,qi=0;
 const T=types.length?types:['blank','desc','ox','match','mc','short'];
 let guard=0;while(items.length<n&&guard++<400){const t=T[items.length%T.length];const f=facts[fi++%facts.length];
  if(t==='blank'){items.push({t:'빈칸',q:`${f.d} → 이것을 (<span class="blank"></span>)(이)라고 한다.`,a:f.t})}
  else if(t==='desc'){items.push({t:'서술',q:`<b>${f.t}</b>의 뜻을 한 문장으로 설명하시오.`,a:f.d})}
  else if(t==='ox'){const wrong=Math.random()<.5;const other=all.find(x=>x.t!==f.t);items.push({t:'O/X',q:`<b>${f.t}</b>: ${wrong?other.d:f.d} ( O / X )`,a:wrong?'X — 올바른 설명: '+f.d:'O'})}
  else if(t==='match'){const set=[0,1,2,3].map(k=>facts[(fi+k)%facts.length]);fi+=4;if(facts.length<4)continue;const defs=shuffle(set.map(s=>s.d));items.push({t:'연결',q:`<div class="match">${set.map((s,i)=>`<div>${['①','②','③','④'][i]} ${s.t}</div><div>${['㉠','㉡','㉢','㉣'][i]} ${defs[i]}</div>`).join('')}</div>`,a:set.map((s,i)=>['①','②','③','④'][i]+'-'+['㉠','㉡','㉢','㉣'][defs.indexOf(s.d)]).join(', ')})}
  else if(t==='mc'){const q=qs[qi++%qs.length];const o=shuffle(q.o.map((x,i)=>({x,ok:i===q.a})));items.push({t:'선택',q:`${q.q}<br>${o.map((x,i)=>['①','②','③','④'][i]+' '+x.x).join('&nbsp; ')}`,a:['①','②','③','④'][o.findIndex(x=>x.ok)]+' '+q.e})}
  else{const q=qs[qi++%qs.length];items.push({t:'단답',q:q.q.replace(/\?$/,'').replace(/은\?|는\?|로 옳은 것은|가 아닌 것은/g,'')+' (단답)',a:q.o[q.a]+' — '+q.e})}}
 return items}
let wsCur=null;
function renderWS(){
 const prev=store.get('ws.'+key());
 $('#content').innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">학습지 생성기</div><h3>매번 다른 문제로 뽑히는 단원 학습지</h3></div>
 <div class="row"><select id="wsN">${[10,15,20,25,30].map(n=>`<option ${n===20?'selected':''}>${n}</option>`).join('')}</select><span style="font-size:13px">문항</span><button class="pri" id="wsGen">새 학습지 생성</button></div></div>
 <div class="row" style="margin-top:10px;font-size:13px">${[['blank','빈칸 채우기'],['desc','용어 서술'],['ox','O/X'],['match','짝 맞추기'],['mc','객관식'],['short','단답']].map(t=>`<label><input type="checkbox" data-t="${t[0]}" checked> ${t[1]}</label>`).join('')}</div>
 <div class="row" style="margin-top:10px"><label style="font-size:13px"><input type="checkbox" id="wsAns"> 정답지 표시</label><button class="sm" id="wsCopy">텍스트 복사</button><button class="sm" id="wsPrint">🖨️ 인쇄</button><button class="sm" id="wsCode">학습지 번호 공유</button><input type="text" id="wsSeed" placeholder="번호 입력" style="width:110px"><button class="sm" id="wsLoad">불러오기</button></div>
 <p style="font-size:12px;color:var(--muted);margin:8px 0 0">지식 항목 ${FACTS.length}개 + 문제 ${QUIZ.length}개에서 조합하므로 생성할 때마다 구성이 달라집니다. "학습지 번호"를 공유하면 같은 학습지를 다른 기기에서 다시 볼 수 있습니다.</p></div>
 <div class="card"><div class="row between"><h3 id="wsTitle">${U()[0]} 학습지</h3><span class="pill" id="wsNo"></span></div><div class="row" style="font-size:13px;color:var(--muted);margin:4px 0 12px">이름: ______________ &nbsp; 학번: ________ &nbsp; 날짜: ${new Date().toLocaleDateString('ko-KR')}</div><div class="ws" id="wsBody"></div></div>`;
 let seeded=Math.random;
 function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
 function build(seed){const orig=Math.random;Math.random=mulberry(seed);const types=$$('[data-t]:checked').map(c=>c.dataset.t);wsCur={seed,items:genWS(+$('#wsN').value,types)};Math.random=orig;store.set('ws.'+key(),{seed,n:+$('#wsN').value,types});draw()}
 function draw(){$('#wsNo').textContent='No. '+wsCur.seed;const ans=$('#wsAns').checked;$('#wsBody').innerHTML=wsCur.items.map((it,i)=>`<div class="item"><i>${i+1}</i><div style="min-width:0;flex:1"><span class="pill" style="font-size:11px">${it.t}</span> ${it.q}${ans?`<div class="ans">정답: ${it.a}</div>`:''}</div></div>`).join('')}
 $('#wsGen').onclick=()=>build(100000+rnd(900000));$('#wsAns').onchange=draw;$('#wsPrint').onclick=()=>{document.body.classList.add('printing');setTimeout(()=>{window.print();document.body.classList.remove('printing')},50)};
 $('#wsLoad').onclick=()=>{const s=+$('#wsSeed').value;if(!s){toast('번호를 입력하세요');return}build(s)};
 $('#wsCode').onclick=()=>{navigator.clipboard.writeText(String(wsCur.seed)).then(()=>toast('번호 '+wsCur.seed+' 복사됨')).catch(()=>toast('번호: '+wsCur.seed))};
 $('#wsCopy').onclick=()=>{const txt=`${U()[0]} 학습지 No.${wsCur.seed}\n\n`+wsCur.items.map((it,i)=>`${i+1}. [${it.t}] ${it.q.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ')}`).join('\n')+($('#wsAns').checked?'\n\n[정답]\n'+wsCur.items.map((it,i)=>`${i+1}. ${it.a}`).join('\n'):'');navigator.clipboard.writeText(txt).then(()=>toast('복사했습니다. 한글/워드에 붙여넣으세요')).catch(()=>toast('복사가 차단되었습니다'))};
 if(prev){$('#wsN').value=prev.n;$$('[data-t]').forEach(c=>c.checked=prev.types.includes(c.dataset.t));build(prev.seed)}else build(100000+rnd(900000));
}

/* ================= QUIZ ================= */
let qz=null;
function renderQuiz(){
 $('#content').innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">학습 퀴즈</div><h3>매번 랜덤 출제되는 단원 퀴즈</h3></div>
 <div class="row"><select id="qzN">${[5,10,15,20].map(n=>`<option value="${n}" ${n===10?'selected':''}>${n}문제</option>`).join('')}</select><select id="qzPool"><option value="g">이 학년</option><option value="all">전 학년 100문제</option></select><select id="qzTime"><option value="0">시간 제한 없음</option><option value="20">20초</option><option value="10">10초</option></select><label style="font-size:13px"><input type="checkbox" id="qzInst" checked> 즉시 해설</label><button class="pri" id="qzStart">시작</button>${AI.key()?'<button id="qzAI" title="이 단원 요약을 바탕으로 AI가 새 문제를 만들어요">🤖 AI 새 문제</button>':''}</div></div></div><div id="qzBody"></div>`;
 $('#qzStart').onclick=startQuiz;const qa=$('#qzAI');if(qa)qa.onclick=aiStudentQuiz;
 const hist=store.get('qh.'+key(),[]);if(hist.length)$('#qzBody').innerHTML=`<div class="card"><div class="eyebrow">최근 기록</div><div class="row" style="margin-top:6px">${hist.slice(-8).reverse().map(h=>`<span class="pill ${h.s>=80?'good':h.s>=50?'warn':'bad'}">${h.s}점 · ${h.d}</span>`).join('')}</div></div>`;
}
async function aiStudentQuiz(){const n=+$('#qzN').value||10;const btn=$('#qzAI');btn.disabled=true;btn.textContent='✨ 만드는 중…';const days=((DAYS[G().id]||[])[S.u]||[]);const ctx=days.map(d=>`- ${d[0]}: ${(d[1]||[]).join(' ')}`).join('\n').slice(0,6000);
 try{const r=await AI.chat(`당신은 한국 ${HL_GRADE_DESC[G().id]||'중등 사회'} 교사다. 교육과정에 충실하고 사실 오류가 없어야 한다. 반드시 유효한 JSON만 출력. 문자열 안에는 큰따옴표(")를 쓰지 말고 「」를 사용. 문체는 '~이다/~인가?'체.`,`단원: ${U()[0]}\n학년: ${G().name}\n\n[수업 요약 자료]\n${ctx||'(요약 없음 — 단원명을 근거로 출제)'}\n\n{"quiz":[{q, o(보기 4개 배열), a(정답 인덱스 0-3), e(한 줄 해설)} × ${n}]} 형식의 JSON 객체를 출력. 정답 위치를 고르게 섞고, 자료 해석·인과 문항도 섞을 것.`);const d=await AI.parse(r.text);const Q=(d.quiz||[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4).map(x=>({g:G().id,q:x.q,o:x.o,a:+x.a,e:x.e||'AI 생성 문제'}));if(!Q.length)throw new Error('문제를 만들지 못했어요. 다시 눌러 보세요');
  qz={qs:Q.map(q=>({...q,opts:shuffle(q.o.map((t,i)=>({t,ok:i===q.a}))),pick:null})),i:0,tl:+$('#qzTime').value,inst:$('#qzInst').checked,t0:Date.now(),iv:null,ai:true};toast(`🤖 ${U()[0]} AI 문제 ${Q.length}개`);drawQ()}catch(e){toast('⚠️ '+e.message);btn.disabled=false;btn.textContent='🤖 AI 새 문제'}}
function startQuiz(){const n=+$('#qzN').value||10,pool=$('#qzPool').value==='g'?poolQuiz(G().id):allQuiz(),tl=+$('#qzTime').value,inst=$('#qzInst').checked;
 qz={qs:shuffle(pool).slice(0,n).map(q=>({...q,opts:shuffle(q.o.map((t,i)=>({t,ok:i===q.a}))),pick:null})),i:0,tl,inst,t0:Date.now(),iv:null};drawQ()}
function drawQ(){const q=qz.qs[qz.i];clearInterval(qz.iv);let left=qz.tl;
 $('#qzBody').innerHTML=`<div class="card"><div class="row between"><span class="eyebrow">${qz.i+1} / ${qz.qs.length}</span>${qz.tl?`<span class="pill num" id="qzT">${left}초</span>`:''}</div><div class="bar" style="margin:8px 0 12px"><i style="width:${qz.i/qz.qs.length*100}%"></i></div>
 <div class="q">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button data-i="${i}">${['①','②','③','④'][i]} ${o.t}</button>`).join('')}</div><div id="qzFb" style="margin-top:12px"></div></div>`;
 $$('#qzBody .opts button').forEach(b=>b.onclick=()=>pickQ(+b.dataset.i));
 if(qz.tl)qz.iv=setInterval(()=>{left--;const t=$('#qzT');if(t)t.textContent=left+'초';if(left<=0)pickQ(-1)},1000)}
function pickQ(i){const q=qz.qs[qz.i];if(q.pick!==null)return;clearInterval(qz.iv);q.pick=i;const ok=i>=0&&q.opts[i].ok;
 $$('#qzBody .opts button').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('no')});
 const next=()=>{qz.i++;qz.i<qz.qs.length?drawQ():endQuiz()};
 if(qz.inst){$('#qzFb').innerHTML=`<div class="card soft"><b>${ok?'정답! 🎉':i<0?'시간 초과':'아쉽네요'}</b> <span style="font-size:14px">— ${q.e}</span><div class="row" style="margin-top:8px"><button class="pri" id="qzNext">다음</button></div></div>`;$('#qzNext').onclick=next}else setTimeout(next,600)}
function endQuiz(){const ok=qz.qs.filter(q=>q.pick>=0&&q.opts[q.pick].ok).length,s=Math.round(ok/qz.qs.length*100),sec=((Date.now()-qz.t0)/1000).toFixed(0);
 const rec=store.get('rec.'+key(),{best:null,n:0});rec.n++;rec.best=rec.best==null?s:Math.max(rec.best,s);store.set('rec.'+key(),rec);const h=store.get('qh.'+key(),[]);h.push({s,d:new Date().toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})});store.set('qh.'+key(),h.slice(-20));logAct(qz.ai?'AI퀴즈':'퀴즈',G().name+' · '+U()[0]+' ('+qz.qs.length+'문제)',s);renderNav();
 $('#qzBody').innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">결과</div><h2 style="font-size:40px;margin:6px 0">${s}점</h2><p class="num">${ok}/${qz.qs.length} 정답 · ${sec}초 · ${s>=90?'완벽해요!':s>=70?'잘했어요':s>=50?'조금 더 복습!':'해설을 다시 읽어 보세요'}</p>
 <div class="row" style="justify-content:center"><button class="pri" id="qzRe">새 문제로 다시</button><button id="qzRev">오답 보기</button></div></div><div id="qzRevBody"></div>`;
 $('#qzRe').onclick=startQuiz;$('#qzRev').onclick=()=>{const wrong=qz.qs.filter(q=>!(q.pick>=0&&q.opts[q.pick].ok));$('#qzRevBody').innerHTML=wrong.length?`<div class="card ws">${wrong.map((q,i)=>`<div class="item"><i>${i+1}</i><div>${q.q}<div class="ans">정답: ${q.o[q.a]}</div><div style="font-size:13px;color:var(--muted)">${q.e}</div></div></div>`).join('')}</div>`:'<div class="card">틀린 문제가 없습니다. 🎉</div>'}}
