<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: glowing navy "night lab". Sticky top bar, grade chips, unit rail, main stage. Dark-first with full light theme. */
:root{
  --bg:#0f172a; --bg2:#101b33; --panel:#162238; --panel2:#1d2a44; --line:#2a3a5c; --fg:#eef2ff; --muted:#9aa8c7;
  --accent:#5eead4; --accent2:#a78bfa; --coral:#fb7185; --amber:#fbbf24;
  --warn:#f59e0b; --bad:#f43f5e; --good:#34d399; --p1:#38bdf8; --p2:#fb7185;
  --glow1:rgba(94,234,212,.22); --glow2:rgba(167,139,250,.25);
  --display:"Gothic A1","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f6fc;--bg2:#ffffff;--panel:#ffffff;--panel2:#eef1fa;--line:#d8def0;--fg:#141a2e;--muted:#5f6b8a;--accent:#0f9c86;--accent2:#6d4fd6;--coral:#e0405e;--amber:#d08a00;--warn:#c47400;--bad:#d7263d;--good:#15966a;--p1:#1d7fd6;--p2:#e0405e;--glow1:rgba(15,156,134,.14);--glow2:rgba(109,79,214,.14);color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f6fc;--bg2:#ffffff;--panel:#ffffff;--panel2:#eef1fa;--line:#d8def0;--fg:#141a2e;--muted:#5f6b8a;--accent:#0f9c86;--accent2:#6d4fd6;--coral:#e0405e;--amber:#d08a00;--warn:#c47400;--bad:#d7263d;--good:#15966a;--p1:#1d7fd6;--p2:#e0405e;--glow1:rgba(15,156,134,.14);--glow2:rgba(109,79,214,.14);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;background-image:radial-gradient(900px 500px at 10% -10%,var(--glow1),transparent 60%),radial-gradient(800px 500px at 100% 0%,var(--glow2),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;transition:transform .12s,border-color .12s,background .12s}
button:hover{border-color:var(--accent);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#0b1020;font-weight:800}
button.sm{padding:5px 11px;font-size:13px;border-radius:9px}
button.act{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:800}
select,input[type=text],input[type=url],input[type=number]{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px}
input[type=range]{accent-color:var(--accent);width:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:20px}h3{font-size:16px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;box-shadow:0 6px 18px var(--glow2)}
.brand h1{font-size:18px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;font-family:var(--body)}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grades button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:4px 6px 4px 12px}
.timer b{font-family:var(--display);font-size:16px;min-width:52px}
.hero{padding-block:22px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.hero h2{font-size:clamp(22px,3.4vw,32px);font-weight:900}
.hero p{margin:4px 0 0;color:var(--muted)}
.hero .quick{display:flex;gap:8px;flex-wrap:wrap}
.hero .quick button{display:flex;align-items:center;gap:6px;font-weight:700}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 100px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.rail .eyebrow{margin:4px 6px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}.semchips{display:flex;gap:4px}.semchips button{padding:3px 9px;font-size:12px;letter-spacing:0;text-transform:none}
.units{display:flex;flex-direction:column;gap:3px}
.units button{text-align:left;border:none;background:transparent;padding:9px 10px;border-radius:12px;display:flex;gap:9px;align-items:flex-start;transition:background .12s}
.units button:hover{background:var(--panel2);transform:none}
.units button i{font-style:normal;font-family:var(--display);font-size:12px;color:var(--muted);min-width:22px;padding-top:2px}
.units button.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--panel2)),var(--panel2));font-weight:700}
.units button.on i{color:var(--accent)}
.unitsel{display:none}
.stage{min-width:0;display:flex;flex-direction:column;gap:14px}
.uhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between}
.uhead h2{font-size:24px}
.mods{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px}
.mods button{border:none;background:transparent;padding:9px 14px;font-weight:700;border-radius:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mods button:hover{transform:none;color:var(--fg)}
.mods button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.card.soft{background:var(--panel2);border-color:transparent;box-shadow:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:14px;background:var(--panel2);min-width:0}
.stat b{font-family:var(--display);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.ctrl{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ctrl label{display:flex;justify-content:space-between;color:var(--muted)}
.ctrl label b{color:var(--fg)}
canvas{max-width:100%;display:block;border-radius:14px;background:var(--panel2)}
.log{font-size:13px;max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:var(--panel2);border-radius:12px}
.log div::before{content:"▸ ";color:var(--accent)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2)}
.pill.good{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.bar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opts button{text-align:left;padding:12px 14px;border-radius:14px;background:var(--panel2);border-color:transparent}
.opts button.ok{background:color-mix(in srgb,var(--good) 22%,var(--panel2));border-color:var(--good)}
.opts button.no{background:color-mix(in srgb,var(--bad) 22%,var(--panel2));border-color:var(--bad)}
.opts button:disabled{cursor:default;transform:none}
.q{font-size:18px;font-weight:700;margin:6px 0 12px}
.race{position:relative;display:flex;flex-direction:column;gap:10px}
.lane{position:relative;height:46px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--panel2) 0 40px,color-mix(in srgb,var(--line) 60%,var(--panel2)) 40px 44px);overflow:hidden}
.lane .car{position:absolute;top:6px;left:0;height:34px;padding:0 10px;border-radius:9px;color:#0b1020;display:flex;align-items:center;font-weight:800;font-family:var(--display);transition:left .4s cubic-bezier(.3,1.3,.5,1);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.lane .goal{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(0deg,#222 0 8px,#fff 8px 16px)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{border:2px solid var(--line);border-radius:16px;padding:12px}
.side.p1{border-color:var(--p1)}.side.p2{border-color:var(--p2)}
.side .opts{grid-template-columns:1fr 1fr}
.side .opts button{font-size:14px;padding:10px}
.ws{display:flex;flex-direction:column;gap:10px}
.ws .item{padding:12px 14px;border-radius:14px;background:var(--panel2);display:flex;gap:10px}
.ws .item i{font-style:normal;font-family:var(--display);color:var(--accent);min-width:26px}
.ws .ans{color:var(--good);font-weight:700;margin-top:4px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--fg);margin:0 3px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.feat{columns:2;font-size:13px;color:var(--muted);gap:16px}
.feat div{break-inside:avoid;padding:2px 0}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.map div{aspect-ratio:1;border-radius:5px;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:2px solid transparent}
.map div.sel{border-color:var(--fg)}
.vid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vid a{display:flex;flex-direction:column;gap:8px;padding:0 0 12px;border-radius:16px;background:var(--panel2);color:inherit;text-decoration:none;border:1px solid transparent;overflow:hidden;transition:transform .15s,border-color .15s}
.vid a:hover{border-color:var(--accent);transform:translateY(-2px)}
.vid a .thumb{aspect-ratio:16/9;width:100%;max-width:100%;background:var(--panel) center/cover no-repeat;display:grid;place-items:center;position:relative}
.vid a .thumb::after{content:"▶";position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:16px;padding-left:3px}
.vid a b{font-size:14px;padding:0 12px;line-height:1.4}.vid a span{font-size:12px;color:var(--muted);padding:0 12px}
.vid a .del{margin:0 12px;align-self:flex-start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tright{text-align:right}
.overlay{position:fixed;inset:0;background:rgba(5,10,25,.72);backdrop-filter:blur(6px);z-index:30;display:grid;place-items:start center;padding:80px 16px 16px}
.overlay .box{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.overlay input{width:100%;font-size:17px;padding:12px 14px}
.sres{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:50vh;overflow:auto}
.sres button{text-align:left;border:none;background:transparent;padding:9px 12px;border-radius:10px;display:flex;gap:8px;align-items:center}
.sres button:hover{background:var(--panel2);transform:none}
.sres .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.progress-card{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),var(--panel2) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-size:13px}
.footer{padding:24px 16px 40px;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.rail{display:none}.unitsel{display:block}.vs{grid-template-columns:1fr}.feat{columns:1}.map{grid-template-columns:repeat(8,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff!important;color:#000!important}.top,.hero,.rail,.mods,.uhead .row,.footer,.toast,.card:first-of-type .row,#wsBody ~ *{display:none!important}.wrap{display:block;padding:0}.card{border:none;box-shadow:none;padding:0}.ws .item{background:#fff;border:1px solid #ccc;break-inside:avoid}.stage>.card:first-child{display:none}}
/* gate */
body.gated .top,body.gated .hero,body.gated .wrap,body.gated .footer{display:none!important}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-in{width:100%;max-width:820px}
.gate-roles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:18px}
.gate-roles .card{display:flex;flex-direction:column}
.gate-roles input,.gate-roles select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:inherit}
.pill.good{background:rgba(52,211,153,.18);color:var(--good)}
</style>

 [['1일차 · 문화의 의미와 속성',['문화: 한 사회 구성원이 공유하는 생활 양식(좁게는 예술, 넓게는 의식주·언어·제도).','속성: 학습성, 공유성, 축적성, 변동성, 전체성(요소들이 서로 연결).','본능과 문화의 차이 사례로 구분하기.'],'문화의 속성, 학습성, 공유성'],
  ['2일차 · 문화를 바라보는 태도',['자문화 중심주의: 내 문화가 최고(갈등·국수주의). 문화 사대주의: 남의 문화가 더 우수(정체성 상실).','문화 상대주의: 그 사회의 맥락에서 이해 → 바람직. 단, 인권을 해치면 극단적 상대주의 경계.','각 태도의 사례(식민 지배 정당화, 명품 선호, 음식 문화 존중)를 구분.'],'자문화 중심주의, 문화 사대주의, 문화 상대주의'],
  ['3일차 · 대중문화와 대중 매체',['대중문화: 대중 매체를 통해 다수가 소비하는 문화(드라마·게임·SNS).','긍정: 여가·공감·문화 민주화. 부정: 상업성, 획일화, 가짜 뉴스.','비판적 수용과 능동적 참여(1인 미디어)가 필요하다.'],'대중문화, 대중 매체, 비판적 수용'],
  ['4일차 · 문화 변동과 단원 정리',['문화 변동 요인: 발명·발견(내부), 전파(외부).','문화 접변의 결과: 문화 병존, 문화 동화, 문화 융합(퓨전).','전통문화를 계승하면서 새로운 문화를 창조하는 태도.'],'문화 전파, 문화 동화, 문화 융합']],
 [['1일차 · 정치의 의미',['정치: 사회 구성원 사이의 갈등을 조정하고 공동의 문제를 해결하는 활동(좁게는 국가 활동).','정치는 국회·정부뿐 아니라 학급 회의·동아리에서도 일어난다.','권력의 정당성이 중요하다.'],'정치, 권력, 갈등 조정'],
  ['2일차 · 민주주의의 발전',['고대 아테네 직접 민주주의(시민만 참여, 노예·여성 제외).','근대 시민 혁명(영국 명예혁명, 미국 독립, 프랑스 혁명)으로 자유·평등 이념 확립.','현대: 보통 선거 확대, 대의 민주주의, 전자 민주주의.'],'직접 민주주의, 대의 민주주의, 시민 혁명'],
  ['3일차 · 민주 정치의 기본 원리',['국민 주권: 권력은 국민에게서. 국민 자치: 국민 스스로 또는 대표를 통해 다스림.','입헌주의(헌법에 따른 통치), 권력 분립(입법·행정·사법 분리로 견제).','헌법 제1조와 연결해 암기.'],'국민 주권, 입헌주의, 권력 분립'],
  ['4일차 · 민주주의 이념과 단원 정리',['민주주의의 근본 이념: 인간의 존엄성. 실현 수단: 자유와 평등.','자유와 평등이 충돌할 때 조화가 필요하다.','일상 속 민주주의 실천 사례 찾기.'],'인간의 존엄성, 자유, 평등']],
 [['1일차 · 정치 과정과 정치 주체',['정치 과정: 요구(투입) → 정책 결정(산출) → 평가(환류).','정치 주체: 국가 기관(국회·정부·법원)과 정당·이익 집단·시민 단체·언론·개인.','정당(정권 획득 목표)과 이익 집단(특수 이익)의 차이.'],'정치 과정, 정당, 이익 집단, 시민 단체'],
  ['2일차 · 선거의 의미와 원칙',['선거는 대표를 뽑고 권력에 정당성을 주는 가장 기본적인 참여 방법.','4원칙: 보통(일정 나이면 누구나)·평등(1인 1표)·직접(본인이)·비밀 선거.','선거관리위원회가 공정한 선거를 관리한다.'],'선거 4원칙, 선거관리위원회'],
  ['3일차 · 선거 제도',['다수 대표제(소선거구, 1등만 당선)와 비례 대표제(정당 득표율대로 의석).','우리나라 국회 의원 선거는 지역구 + 비례 대표 혼합.','선거구 법정주의로 게리맨더링을 막는다.'],'소선거구제, 비례 대표제, 선거구 법정주의'],
  ['4일차 · 지방 자치와 시민 참여',['지방 자치: 지역 주민이 지방 의회·단체장을 뽑아 지역 문제를 스스로 결정(민주주의의 학교).','참여 방법: 투표, 청원, 주민 투표·주민 소환, 집회, 1인 시위, 온라인 참여.','청소년도 학생 자치·정책 제안으로 참여할 수 있다.'],'지방 자치, 주민 소환, 청원']],
 [['1일차 · 법의 의미와 목적',['사회 규범: 관습·도덕·종교·법. 법은 국가가 강제력으로 지키게 한다.','법의 목적: 정의 실현, 사회 질서 유지, 개인의 권리 보호.','"착한 사마리아인 법" 사례로 도덕과 법의 경계 토론.'],'사회 규범, 강제성, 정의'],
  ['2일차 · 법의 종류',['공법(국가-개인): 헌법·형법·행정법·소송법. 사법(개인-개인): 민법·상법.','사회법(약자 보호): 노동법·경제법·사회 보장법.','사례를 보고 어떤 법이 적용되는지 분류하기.'],'공법, 사법, 사회법'],
  ['3일차 · 재판의 종류와 절차',['민사 재판(개인 간 분쟁, 원고·피고), 형사 재판(범죄, 검사·피고인).','3심제(지방 법원→고등 법원→대법원)로 잘못된 판결을 바로잡을 기회.','공정한 재판 원칙: 공개 재판, 증거 재판, 무죄 추정.'],'민사 재판, 형사 재판, 3심제, 무죄 추정'],
  ['4일차 · 청소년과 법, 단원 정리',['미성년자 계약은 법정 대리인 동의가 없으면 취소 가능.','소년법: 19세 미만 범죄에 보호 처분 우선. 학교 폭력 예방법.','권리 침해 시 구제 방법: 법률 구조 공단, 국가 인권 위원회.'],'미성년자 보호, 소년법, 권리 구제']]
],
m2:[
 [['1일차 · 역사와 선사 시대',['역사는 문자 기록 이후, 선사는 그 이전(구석기·신석기).','구석기: 뗀석기, 이동 생활, 동굴 벽화. 신석기 혁명: 농경·목축 시작, 토기, 정착.','청동기 시대에 계급과 국가가 등장한다.'],'신석기 혁명, 뗀석기, 간석기'],
  ['2일차 · 메소포타미아·이집트 문명',['메소포타미아: 티그리스·유프라테스강, 개방적 지형 → 잦은 교체, 쐐기 문자, 함무라비 법전, 지구라트.','이집트: 나일강, 폐쇄적 지형 → 통일 왕국 지속, 상형 문자, 피라미드, 태양력, 내세 신앙.','두 문명의 자연환경과 문화 비교.'],'쐐기 문자, 함무라비 법전, 상형 문자, 피라미드'],

  ['4일차 · 고대 그리스',['폴리스(아테네·스파르타), 아테네 민주 정치(민회·도편 추방제), 페르시아 전쟁 승리.','펠로폰네소스 전쟁 후 쇠퇴 → 알렉산드로스 제국 → 헬레니즘 문화(동서 융합).','그리스 문화: 철학(소크라테스), 파르테논 신전, 올림픽.'],'폴리스, 도편 추방제, 헬레니즘'],
  ['5일차 · 로마와 고대 제국',['로마 공화정(원로원·호민관·12표법) → 포에니 전쟁 → 제정(아우구스투스).','로마법·도로·수도교, 크리스트교 공인(밀라노 칙령)과 국교화.','진·한: 진시황 통일(군현제·문자 통일·만리장성), 한 무제(유교·비단길·장건).'],'공화정, 12표법, 군현제, 비단길']],

  ['2일차 · 동아시아 문화권의 형성',['위진 남북조 혼란 → 수의 통일(대운하) → 당의 번영(율령·3성 6부·균전제·조용조·과거).','당 문화의 국제성(장안), 한자·유교·불교·율령이 동아시아 공통 요소.','일본 다이카 개신과 나라·헤이안 시대.'],'율령, 3성 6부, 조용조, 동아시아 문화권'],

  ['4일차 · 크리스트교 세계: 중세 유럽',['게르만족 이동 → 프랑크 왕국(카롤루스 대제) → 봉건제(주종 관계)와 장원제(농노).','로마 가톨릭 교황권 강화(카노사의 굴욕), 비잔티움 제국(그리스 정교, 성 소피아 성당).','십자군 전쟁(1096~) → 교황권 쇠퇴, 상공업·도시 발달.'],'봉건제, 장원제, 교황권, 십자군'],

 [['1일차 · 몽골 제국과 동서 교류',['칭기즈 칸 통일, 쿠빌라이 원 건국 → 유라시아를 잇는 최대 제국, 역참제.','팍스 몽골리카: 마르코 폴로, 이븐 바투타, 화약·나침반·인쇄술 서양 전파.','송의 발전(과거제 강화, 사대부, 상업·교자)과 성리학(주희).'],'역참, 팍스 몽골리카, 성리학'],
  ['2일차 · 명·청과 동아시아',['명(주원장): 한족 부흥, 정화의 남해 원정, 북로남왜 → 청(만주족): 강희·옹정·건륭, 만한 병용.','조선·일본(에도 막부)의 교류, 은 유통과 상업 발달.','유럽 선교사가 서양 과학을 전함(마테오 리치).'],'정화, 에도 막부, 은 무역'],
  ['3일차 · 서아시아·인도의 이슬람 제국',['오스만 제국: 콘스탄티노플 점령(1453), 술레이만 1세, 관용 정책(밀레트).','사파비(시아파, 이스파한), 무굴(아크바르 관용 → 아우랑제브 차별, 타지마할).','이슬람·힌두 문화 융합(시크교, 우르두어).'],'오스만, 무굴, 아크바르, 타지마할'],
  ['4일차 · 르네상스와 종교 개혁',['르네상스(이탈리아): 인문주의, 다빈치·미켈란젤로, 북유럽 르네상스(에라스뮈스).','종교 개혁: 루터 95개조(1517), 칼뱅(예정설), 영국 국교회 → 신·구교 갈등, 30년 전쟁.','활판 인쇄술이 사상 전파를 가속.'],'인문주의, 95개조 반박문, 칼뱅'],
  ['5일차 · 신항로 개척과 유럽의 변화',['바스쿠 다 가마(인도 항로), 콜럼버스(1492), 마젤란(세계 일주).','가격 혁명·상업 혁명, 아메리카 문명(아스테카·잉카) 파괴, 삼각 무역과 노예 무역.','절대 왕정(왕권신수설·중상주의·관료제·상비군): 루이 14세, 펠리페 2세.'],'신항로 개척, 삼각 무역, 절대 왕정']],
 [['1일차 · 영국 혁명과 미국 혁명',['청교도 혁명(크롬웰) → 명예혁명(1688, 권리 장전, 입헌 군주제).','미국: 보스턴 차 사건 → 독립 선언(1776) → 연방 헌법, 삼권 분립, 대통령제.','계몽사상(로크·몽테스키외·루소)이 혁명의 사상적 배경.'],'권리 장전, 독립 선언, 계몽사상'],
  ['2일차 · 프랑스 혁명과 나폴레옹',['구제도 모순 → 삼부회 → 바스티유 습격(1789) → 인권 선언 → 공화정, 공포 정치.','나폴레옹: 법전, 유럽 정복 → 몰락 → 빈 체제(보수 반동).','자유주의·민족주의 확산, 7월·2월 혁명.'],'인권 선언, 나폴레옹 법전, 빈 체제'],
  ['3일차 · 산업 혁명과 사회 변화',['영국에서 시작(자본·석탄·식민지·인클로저 노동력), 방적기·증기 기관·철도.','공장제, 도시화, 노동 문제(장시간·아동 노동) → 공장법, 노동조합, 사회주의(마르크스).','자본주의 확산과 국민 국가 형성(이탈리아·독일 통일).'],'산업 혁명, 증기 기관, 노동 문제'],
  ['4일차 · 제국주의와 아시아·아프리카 침략',['제국주의: 산업 자본 + 사회 진화론, 아프리카 분할(베를린 회의 1884).','아편 전쟁(1840)·난징 조약, 태평천국 운동, 양무운동, 변법자강, 신해혁명(쑨원, 1911).','인도: 세포이 항쟁 → 영국 직접 통치. 동남아 식민화(태국만 독립).'],'아편 전쟁, 양무운동, 신해혁명, 세포이 항쟁'],
  ['5일차 · 일본 근대화와 한국',['메이지 유신(1868): 서양식 개혁, 청일·러일 전쟁 승리, 한국 침략.','조선 개항(강화도 조약 1876)과 동아시아 국민 국가 건설 운동 비교.','제국주의 침략에 맞선 저항 운동 정리.'],'메이지 유신, 강화도 조약']],
 [['1일차 · 제1차 세계 대전',['배경: 3국 동맹 vs 3국 협상, 발칸 분쟁 → 사라예보 사건(1914).','총력전·참호전·신무기, 미국 참전 → 독일 항복(1918), 베르사유 조약.','국제 연맹 창설(1920), 민족 자결주의 → 3·1 운동 등 영향.'],'사라예보, 베르사유 조약, 국제 연맹'],
  ['2일차 · 러시아 혁명과 전후 세계',['러시아 혁명(1917): 2월 혁명(제정 붕괴) → 10월 혁명(레닌, 소비에트) → 소련 성립.','전후 민주주의 확대(여성 참정권), 바이마르 공화국.','아시아 민족 운동: 5·4 운동(중국), 간디의 비폭력 운동(인도).'],'레닌, 소비에트, 5·4 운동, 간디'],
  ['3일차 · 대공황과 전체주의',['대공황(1929, 뉴욕 증시 붕괴) → 뉴딜 정책(미국), 블록 경제(영·프).','전체주의: 이탈리아 파시즘(무솔리니), 독일 나치즘(히틀러), 일본 군국주의.','침략: 만주 사변, 에티오피아 침공, 에스파냐 내전.'],'대공황, 뉴딜, 파시즘, 나치즘'],
  ['4일차 · 제2차 세계 대전',['독일 폴란드 침공(1939) → 프랑스 함락 → 독소전 → 진주만(1941) → 미국 참전.','스탈린그라드·노르망디 상륙 → 독일 항복(1945.5) → 원자 폭탄 → 일본 항복(8.15).','홀로코스트, 난징 대학살, 일본군 위안부 등 전쟁 범죄.'],'진주만, 노르망디, 홀로코스트'],
  ['5일차 · 전후 처리와 단원 정리',['국제 연합(UN) 창설(1945), 뉘른베르크·도쿄 재판, 세계 인권 선언(1948).','두 전쟁의 공통점·차이점과 평화의 가치.','연표로 1914~1945 정리.'],'국제 연합, 세계 인권 선언']],
 [['1일차 · 냉전 체제의 형성',['미국(자본주의, 트루먼 독트린·마셜 계획·NATO) vs 소련(공산주의, 코민포름·바르샤바 조약).','독일 분단과 베를린 봉쇄, 중국 공산화(1949), 6·25 전쟁, 쿠바 미사일 위기.','제3 세계(비동맹)의 등장: 반둥 회의.'],'냉전, 트루먼 독트린, 마셜 계획, 제3 세계'],
  ['2일차 · 아시아·아프리카의 독립',['인도·파키스탄 분리 독립, 베트남 전쟁(1975 통일), 중동 전쟁과 팔레스타인 문제.','아프리카의 해(1960), 남아공 아파르트헤이트 철폐(만델라).','신생국의 과제: 빈곤·내전·독재.'],'베트남 전쟁, 아프리카의 해, 아파르트헤이트'],
  ['3일차 · 냉전의 완화와 해체',['데탕트(닉슨 방중), 소련 고르바초프 개혁(페레스트로이카·글라스노스트).','베를린 장벽 붕괴(1989) → 독일 통일 → 소련 해체(1991) → 냉전 종식.','중국 개혁·개방(덩샤오핑), 톈안먼 사건.'],'데탕트, 페레스트로이카, 소련 해체'],
  ['4일차 · 현대 세계의 과제',['세계화(WTO·EU·다국적 기업)와 양극화, 지역 분쟁·테러(9·11), 난민.','환경 문제(지구 온난화, 파리 협정), 감염병, 핵 문제.','과학 기술 발전과 인권·평화를 위한 국제 협력.'],'세계화, 파리 협정, 난민']],
 [['1일차 · 인권의 의미와 역사',['인권: 인간이기에 당연히 갖는 권리. 보편성·천부성·항구성·불가침성.','역사: 마그나 카르타 → 권리 장전 → 미국 독립 선언·프랑스 인권 선언 → 세계 인권 선언(1948).','1세대(자유권) → 2세대(사회권) → 3세대(연대권) 확장.'],'인권의 특징, 세계 인권 선언, 사회권'],
  ['2일차 · 헌법과 기본권',['헌법은 국가 최고 법으로 기본권을 보장하고 국가 기관을 조직.','기본권: 인간의 존엄과 가치·행복 추구권(포괄), 평등권, 자유권, 참정권, 청구권, 사회권.','각 기본권의 사례(종교의 자유, 선거권, 교육받을 권리 등).'],'기본권, 자유권, 사회권, 청구권'],
  ['3일차 · 기본권의 제한과 한계',['헌법 37조 2항: 국가 안전 보장·질서 유지·공공복리를 위해 필요한 경우 법률로써 제한.','본질적 내용은 침해 불가, 과잉 금지 원칙.','코로나 방역과 집회의 자유처럼 충돌 사례 토론.'],'헌법 37조 2항, 과잉 금지'],
  ['4일차 · 인권 침해와 구제',['국가 기관(법원·헌법재판소·국가인권위원회·국민권익위원회)과 시민 단체를 통한 구제.','헌법 소원, 행정 심판, 손해 배상 청구.','노동권 침해 시 노동 위원회, 고용노동부 진정.'],'헌법 소원, 국가인권위원회, 노동 3권']],
 [['1일차 · 국회',['국민이 직접 뽑은 대표로 구성(지역구+비례, 4년), 입법부.','권한: 법률 제정·개정, 예산 심의·확정, 국정 감사·조사, 탄핵 소추, 조약 동의.','본회의와 상임 위원회, 법률 제정 절차.'],'입법권, 국정 감사, 탄핵 소추'],
  ['2일차 · 대통령과 행정부',['대통령: 국가 원수이자 행정부 수반, 5년 단임, 직선.','권한: 법률안 거부권, 국군 통수, 조약 체결, 긴급 명령, 공무원 임명.','국무총리·국무회의·행정 각부·감사원.'],'행정부 수반, 거부권, 국무회의'],
  ['3일차 · 법원과 헌법재판소',['사법부(대법원·고등·지방 법원): 독립된 재판, 3심제, 위헌 명령·규칙 심사.','헌법재판소: 위헌 법률 심판, 탄핵 심판, 정당 해산, 권한 쟁의, 헌법 소원.','사법권 독립의 중요성.'],'사법권 독립, 위헌 법률 심판, 헌법 소원'],
  ['4일차 · 권력 분립과 상호 견제',['국회↔정부(거부권, 탄핵·국정 감사), 국회↔법원(대법관 임명 동의, 위헌 심사), 정부↔법원.','견제와 균형이 권력 남용을 막아 국민의 자유를 지킨다.','시민 참여로 권력을 감시하는 방법.'],'견제와 균형']],
 [['1일차 · 경제 활동과 희소성',['경제 활동: 생산·분배·소비. 경제 주체: 가계·기업·정부(·외국).','희소성: 욕구에 비해 자원이 부족 → 선택의 문제 발생.','경제 문제: 무엇을, 어떻게, 누구를 위해 생산할 것인가.'],'희소성, 경제 주체, 경제 문제'],
  ['2일차 · 합리적 선택과 기회비용',['기회비용 = 명시적 비용 + 암묵적 비용(포기한 것 중 가장 큰 가치).','합리적 선택: 편익 > 기회비용, 한계 비교. 매몰 비용은 고려하지 않는다.','기회비용 계산 문제 연습.'],'기회비용, 매몰 비용, 편익'],
  ['3일차 · 경제 체제',['시장 경제(사유 재산·자유 경쟁·가격 기구)와 계획 경제(국가 결정).','현대 대부분은 혼합 경제. 우리나라는 시장 경제 바탕 + 정부 개입.','각 체제의 장단점 비교.'],'시장 경제, 계획 경제, 혼합 경제'],
  ['4일차 · 자산 관리와 소비',['자산 관리 원칙: 안전성·수익성·유동성. 분산 투자.','금융 상품: 예금·적금, 주식, 채권, 펀드, 보험.','합리적 소비, 신용 관리, 소비자 권리.'],'안전성·수익성·유동성, 분산 투자, 신용']],
 [['1일차 · 시장의 의미와 종류',['시장: 재화·서비스를 사고파는 곳(보이는 시장·보이지 않는 시장).','생산물 시장과 생산 요소 시장(노동·자본·토지), 전자 상거래.','시장은 거래 비용을 줄이고 분업을 가능하게 한다.'],'생산물 시장, 생산 요소 시장'],
  ['2일차 · 수요와 공급',['수요 법칙: 가격↑ 수요량↓(우하향). 공급 법칙: 가격↑ 공급량↑(우상향).','수요 변동 요인: 소득·선호·인구·대체재·보완재 가격. 공급 변동 요인: 생산비·기술·기업 수.','수요량 변동(곡선 위 이동)과 수요 변동(곡선 이동) 구분.'],'수요 법칙, 공급 법칙, 대체재, 보완재'],
  ['3일차 · 균형 가격의 결정과 변동',['균형 가격: 수요량 = 공급량. 초과 수요 → 가격 상승, 초과 공급 → 가격 하락.','수요 증가 → 가격↑ 거래량↑, 공급 증가 → 가격↓ 거래량↑.','그래프로 균형 이동 그리기.'],'균형 가격, 초과 수요, 초과 공급'],
  ['4일차 · 가격의 기능과 정부 개입',['가격은 신호등(정보 전달)이자 자원 배분 기능.','가격 상한제(임대료 규제)는 부족, 가격 하한제(최저 임금)는 과잉을 낳을 수 있다.','시장 실패(독과점·외부 효과·공공재)와 정부의 역할.'],'가격의 기능, 최저 임금, 시장 실패']]
],
m3:[
 [['1일차 · 선사 시대',['구석기(70만 년 전): 뗀석기·주먹도끼, 동굴·막집, 이동. 신석기(1만 년 전): 간석기, 빗살무늬 토기, 농경·정착, 움집.','청동기: 비파형 동검, 고인돌, 계급 발생, 벼농사(반달 돌칼), 군장 국가.','유물로 시대 구분하기.'],'주먹도끼, 빗살무늬 토기, 고인돌'],
  ['2일차 · 고조선과 여러 나라',['고조선(단군, 기원전 2333): 8조법, 위만, 한 무제에 멸망(기원전 108).','부여(사출도·영고), 고구려(제가 회의·동맹·서옥제), 옥저·동예(민며느리제·책화), 삼한(천군·소도).','철기 보급으로 연맹 왕국 성장.'],'8조법, 영고, 소도, 책화'],
  ['3일차 · 삼국의 성립과 발전',['고구려: 태조왕(옥저 정복), 소수림왕(불교·율령·태학), 광개토대왕·장수왕(평양 천도).','백제: 고이왕(관등·율령), 근초고왕(4세기 전성기, 마한·요서·규슈), 성왕(사비).','신라: 내물(김씨 세습), 법흥(율령·불교·금관가야), 진흥왕(한강·순수비·화랑도).'],'소수림왕, 근초고왕, 진흥왕, 순수비'],
  ['4일차 · 삼국의 통치 체제와 대외 관계',['고구려 5부·제가 회의, 백제 6좌평·정사암, 신라 골품제·화백 회의.','고구려-수·당 전쟁: 살수 대첩(612, 을지문덕), 안시성 전투(645).','나·당 동맹 → 백제(660)·고구려(668) 멸망.'],'골품제, 화백 회의, 살수 대첩'],
  ['5일차 · 삼국의 문화와 가야',['불교(왕권 강화), 도교(사신도), 유학(태학·국학), 역사서(국사·서기·신집).','고분: 고구려 굴식 돌방무덤 벽화, 백제 무령왕릉(벽돌무덤), 신라 돌무지덧널무덤(천마총).','가야: 금관가야(김해, 철), 대가야(고령), 일본 문화 전파(왕인·담징).'],'무령왕릉, 사신도, 가야']],
 [['1일차 · 신라의 삼국 통일',['나·당 전쟁: 매소성·기벌포 → 676년 통일 완성(문무왕).','한계(대동강 이남, 외세 이용)와 의의(민족 문화 기반).','김춘추·김유신의 역할.'],'매소성, 기벌포, 문무왕'],
  ['2일차 · 통일 신라의 발전',['신문왕: 진골 숙청(김흠돌), 9주 5소경, 9서당 10정, 국학, 관료전 지급·녹읍 폐지.','전제 왕권 강화, 집사부 시중 강화, 상수리 제도.','경덕왕 이후 귀족 반발로 녹읍 부활.'],'9주 5소경, 관료전, 국학'],
  ['3일차 · 발해의 건국과 발전',['대조영 건국(698, 동모산), 고구려 계승 의식, 무왕(당 공격·장문휴), 문왕(상경 천도·3성 6부), 선왕(해동성국).','통치: 3성 6부(정당성 중심, 독자 운영), 5경 15부 62주.','고구려 문화 + 당 문화(온돌, 이불병좌상, 주작대로).'],'대조영, 해동성국, 3성 6부'],
  ['4일차 · 남북국의 문화와 쇠퇴',['불교: 원효(화쟁·대중화), 의상(화엄·부석사), 불국사·석굴암·성덕 대왕 신종, 선종 유행.','유학: 설총(이두), 최치원(6두품, 시무 10조), 독서삼품과.','신라 말 혼란: 진성 여왕, 농민 봉기(원종·애노), 호족·6두품·선종 → 후삼국(견훤·궁예). 발해 거란에 멸망(926).'],'원효, 의상, 호족, 후삼국']],
 [['1일차 · 고려의 건국과 체제 정비',['왕건 918년 건국, 936년 후삼국 통일, 호족 포섭(사성·혼인), 훈요 10조, 북진 정책.','광종: 노비안검법, 과거제(쌍기), 공복 제정, 칭제 건원. 성종: 최승로 시무 28조, 12목·지방관, 2성 6부.','중앙: 2성 6부·중추원·어사대·삼사, 도병마사·식목도감(귀족 회의).'],'노비안검법, 과거제, 시무 28조, 2성 6부'],
  ['2일차 · 문벌 귀족 사회와 무신 정권',['문벌 귀족(음서·공음전) → 이자겸의 난(1126), 묘청의 서경 천도 운동(1135).','무신 정변(1170, 정중부) → 최씨 정권(교정도감·도방·삼별초), 농민·천민 봉기(망이·망소이, 만적).','무신 정권의 성격과 한계.'],'음서, 묘청, 무신 정변, 만적'],
  ['3일차 · 대외 관계와 몽골 침입',['거란: 서희 외교 담판(강동 6주), 강감찬 귀주 대첩(1019). 여진: 윤관 별무반·동북 9성.','몽골: 강화 천도, 처인성(김윤후), 팔만대장경, 삼별초 항쟁(진도·제주).','원 간섭기: 정동행성·다루가치, 권문세족, 공민왕 개혁(반원·전민변정도감·신돈).'],'강동 6주, 귀주 대첩, 삼별초, 공민왕'],
  ['4일차 · 고려의 경제·사회·문화',['전시과(수조권), 벽란도 무역(아라비아 상인, 코리아), 활구·해동통보.','신분: 귀족·중류층·양민·천민, 향·부곡·소. 여성 지위 비교적 높음(균분 상속).','불교(의천 천태종·지눌 조계종), 성리학 수용(안향), 금속 활자(직지), 청자, 삼국사기·삼국유사.'],'전시과, 벽란도, 직지심체요절, 삼국유사'],
  ['5일차 · 고려 말과 단원 정리',['홍건적·왜구 침입(최영·이성계), 화약(최무선), 목화(문익점).','신진 사대부 성장, 위화도 회군(1388), 과전법(1391) → 조선 건국.','연표로 918~1392 정리.'],'신진 사대부, 위화도 회군, 과전법']],
 [['1일차 · 조선의 건국과 국가 기틀',['1392 이성계 건국, 한양 천도, 정도전(재상 중심)과 이방원 갈등(왕자의 난).','태종: 6조 직계제, 사병 혁파, 호패법. 세종: 집현전, 훈민정음, 4군 6진, 측우기·앙부일구, 의정부 서사제.','세조: 6조 직계 부활, 경국대전 편찬 시작. 성종: 경국대전 완성, 홍문관.'],'6조 직계제, 훈민정음, 경국대전'],
  ['2일차 · 통치 체제',['중앙: 의정부·6조, 3사(사헌부·사간원·홍문관, 언론), 승정원·의금부·춘추관·성균관.','지방: 8도-부·목·군·현, 모든 군현에 수령 파견, 유향소·경재소.','과거(문과·무과·잡과)·음서 축소, 군역(양인 개병), 교육(서당·향교·4부 학당·성균관).'],'3사, 수령, 과거제'],
  ['3일차 · 사림의 성장과 사화',['훈구(세조 공신) vs 사림(길재·김종직, 향촌 자치·서원·향약).','4대 사화: 무오(김종직 조의제문), 갑자, 기묘(조광조 개혁), 을사.','선조 때 사림 집권 → 붕당(동인·서인) 형성.'],'훈구, 사림, 4대 사화, 조광조'],
  ['4일차 · 외교와 전란',['사대교린: 명 사대, 여진·일본 교린(3포 개항).','임진왜란(1592): 이순신(한산도), 의병(곽재우), 관군(진주·행주), 명 참전 → 1598 종결. 영향: 인구·토지 감소, 문화재 소실, 일본 도자기.','광해군 중립 외교 → 인조반정 → 정묘호란(1627)·병자호란(1636, 삼전도) → 북벌론.'],'사대교린, 임진왜란, 병자호란, 북벌'],
  ['5일차 · 조선 전기 문화',['훈민정음, 농사직설, 칠정산, 동국여지승람, 조선왕조실록.','분청사기 → 백자, 안견 몽유도원도, 성리학 발전(이황·이이).','과학 기술과 민족 문화의 발달 정리.'],'조선왕조실록, 칠정산, 이황·이이']],
 [['1일차 · 붕당 정치와 탕평',['붕당: 동인·서인 → 남인·북인 → 예송(현종) → 환국(숙종) → 노론·소론.','영조 탕평책(탕평비·균역법·속대전), 정조(규장각·장용영·화성·초계문신·신해통공).','붕당 정치의 긍정(상호 견제)과 변질(일당 전제).'],'예송, 환국, 탕평책, 규장각'],
  ['2일차 · 경제 변화',['농업: 모내기법(이앙법) 전국 확대 → 광작, 상품 작물(담배·인삼), 지주·소작 갈등.','수취 제도 개편: 영정법(전세), 대동법(공납→쌀, 공인 등장), 균역법(군포 1필).','상업: 사상(송상·경강상인), 장시·보부상, 상평통보 유통, 민영 수공업·광산(덕대).'],'이앙법, 대동법, 공인, 상평통보'],
  ['3일차 · 신분제 동요와 사회 변화',['양반 수 증가(납속·공명첩), 중인의 신분 상승 운동, 노비 감소(노비종모법·공노비 해방 1801).','향촌: 부농 성장, 양반 권위 약화, 향전.','가족: 장자 상속·친영, 여성 지위 하락.'],'납속, 공명첩, 공노비 해방'],
  ['4일차 · 실학과 서민 문화',['실학: 중농(유형원·이익·정약용, 토지 개혁), 중상(유수원·박지원·박제가, 상공업·청 문물), 국학(안정복·유득공·김정호).','서민 문화: 한글 소설(홍길동전·춘향전), 판소리, 탈춤, 풍속화(김홍도·신윤복), 민화, 서민 문학.','서학(천주교) 전래와 박해, 동학(최제우, 인내천).'],'실학, 정약용, 판소리, 동학'],
  ['5일차 · 세도 정치와 농민 봉기',['순조·헌종·철종 때 안동 김씨 등 세도 정치 → 매관매직, 삼정의 문란(전정·군정·환곡).','홍경래의 난(1811, 평안도 차별), 임술 농민 봉기(1862, 진주) → 삼정이정청.','조선 후기 사회 변동 종합 정리.'],'세도 정치, 삼정의 문란, 홍경래의 난']],
 [['1일차 · 흥선 대원군과 개항',['대원군: 세도 정치 타파, 서원 철폐, 경복궁 중건(당백전), 호포제, 사창제, 통상 수교 거부(병인·신미양요, 척화비).','강화도 조약(1876, 운요호 사건): 최초 근대 조약, 불평등(치외법권·해안 측량).','개화 정책: 통리기무아문, 별기군, 수신사·영선사.'],'서원 철폐, 척화비, 강화도 조약'],
  ['2일차 · 개화와 자주 운동',['임오군란(1882) → 청 간섭. 갑신정변(1884, 김옥균 급진 개화파, 3일 천하).','동학 농민 운동(1894): 고부 봉기 → 전주 화약·집강소 → 2차 봉기 → 우금치 패배. 반봉건·반외세.','갑오·을미개혁(신분제 폐지, 단발령), 아관 파천, 독립 협회(만민 공동회), 대한 제국(광무개혁).'],'갑신정변, 동학 농민 운동, 갑오개혁, 독립 협회'],
  ['3일차 · 국권 피탈과 저항',['러일 전쟁 → 을사늑약(1905, 외교권) → 헤이그 특사 → 고종 퇴위 → 군대 해산 → 한일 병합(1910).','의병(을미·을사·정미, 13도 창의군), 애국 계몽 운동(신민회, 국채 보상 운동), 안중근 의거(1909).','국권 피탈 과정 연표.'],'을사늑약, 의병, 신민회, 안중근'],
  ['4일차 · 일제 강점기와 민족 운동',['1910년대 무단 통치(헌병 경찰·토지 조사) → 3·1 운동(1919) → 임시 정부 → 1920년대 문화 통치(산미 증식) → 1930년대 민족 말살(황국 신민화, 창씨개명, 징용·위안부).','국내: 물산 장려, 6·10 만세, 신간회, 광주 학생 운동. 국외: 봉오동·청산리(1920), 의열단·한인 애국단(윤봉길), 한국 광복군.','1945 광복.'],'3·1 운동, 신간회, 청산리, 한국 광복군'],
  ['5일차 · 대한민국의 수립과 발전',['광복 → 미·소 군정 → 모스크바 3상(신탁) → 5·10 총선 → 정부 수립(1948.8.15) → 6·25 전쟁(1950~53).','민주화: 4·19(1960) → 5·16 → 유신(1972) → 5·18(1980) → 6월 항쟁(1987, 직선제).','경제 성장(경제 개발 계획, 새마을, 외환 위기 극복)과 남북 관계(7·4, 6·15).'],'5·10 총선거, 4·19 혁명, 6월 민주 항쟁']],
 [['1일차 · 국민 경제와 국내 총생산',['GDP: 일정 기간 한 나라 안에서 생산된 최종 생산물의 시장 가치 합(국적 무관, 중간재·중고품 제외).','1인당 GDP로 생활 수준 비교, 한계(분배·여가·환경·가사 노동 미반영).','경제 성장률 = GDP 증가율.'],'GDP, 1인당 GDP, 경제 성장률'],
  ['2일차 · 물가와 인플레이션',['물가 지수로 물가 변동 측정. 인플레이션: 물가 지속 상승.','원인: 총수요 증가, 생산비 상승, 통화량 증가. 영향: 화폐 가치 하락, 실물 자산 유리, 채무자 유리.','대책: 통화량 축소·금리 인상(한국은행), 정부 지출 축소, 생산성 향상.'],'물가 지수, 인플레이션, 통화 정책'],
  ['3일차 · 실업',['실업률 = 실업자 ÷ 경제 활동 인구. 비경제 활동 인구(학생·주부)는 제외.','유형: 경기적·구조적·마찰적·계절적 실업.','대책: 경기 부양, 직업 훈련, 고용 정보 제공, 사회 보장.'],'실업률, 구조적 실업, 경기적 실업'],
  ['4일차 · 국제 거래와 환율',['국제 거래 이유: 자원·기술 차이, 비교 우위. 무역 확대(WTO·FTA)와 보호 무역 논쟁.','환율: 외화 1단위 가격. 환율 상승(원화 가치 하락) → 수출 유리·수입 불리, 외채 부담 증가, 해외여행 불리.','환율 결정: 외환 수요(수입·해외여행)와 공급(수출·외국인 투자).'],'비교 우위, 환율, 자유 무역·보호 무역']],
 [['1일차 · 국제 사회의 특징',['국제 사회: 주권 국가 중심, 중앙 정부 없음, 힘의 논리와 국제법·협력 공존.','행위 주체: 국가, 국제기구(UN·WTO), 다국적 기업, 비정부 기구(NGO), 개인.','국제 관계를 보는 관점: 현실주의 vs 자유주의.'],'주권 국가, 국제기구, NGO'],
  ['2일차 · 국제 갈등과 협력',['갈등: 영토(카슈미르·남중국해), 자원(석유·물), 종교·민족(중동·발칸), 무역 분쟁.','협력: 국제 연합(안전 보장 이사회·총회·ICJ), 환경 협약(파리 협정), 공적 개발 원조(ODA).','국제 사회에서 외교의 역할.'],'안전 보장 이사회, 파리 협정, ODA'],
  ['3일차 · 우리나라의 국제 관계',['독도: 역사(안용복, 칙령 41호 1900) 및 실효 지배. 일본의 역사 왜곡, 동북공정 대응.','남북 관계: 분단 → 대화와 교류(7·4, 6·15, 개성 공단) → 평화 통일 노력.','외교 정책: 한미 동맹, 한중·한일 관계, 중견국 외교.'],'독도, 동북공정, 남북 관계'],
  ['4일차 · 세계 시민과 단원 정리',['세계 시민: 인권·평화·환경 등 지구 문제를 자신의 문제로 인식.','실천: 공정 무역, 기부·봉사, 환경 보호, 다양성 존중.','국제 사회에서 우리나라의 위상과 역할.'],'세계 시민, 공정 무역']],
 [['1일차 · 세계의 인구 분포',['인구는 북반구 중위도, 온대 기후, 하천·해안 평야(동아시아·남아시아·서유럽)에 집중.','희박 지역: 극지·사막·고산·열대 우림.','자연적 요인(기후·지형)과 인문적 요인(산업·교통·정치).'],'인구 밀집 지역, 인구 희박 지역'],
  ['2일차 · 인구 이동',['요인: 배출(흡인) 요인, 경제적·정치적(난민)·환경적 이동.','세계: 개발 도상국 → 선진국(멕시코→미국, 북아프리카→유럽). 우리나라: 이촌 향도 → 역도시화·외국인 유입.','이동의 영향: 유입 지역(노동력, 문화 갈등), 유출 지역(인력 유출, 송금).'],'배출 요인, 흡인 요인, 이촌 향도'],
  ['3일차 · 인구 문제',['선진국: 저출산·고령화 → 노동력 부족, 부양비 증가. 개발 도상국: 인구 급증 → 식량·일자리 부족, 도시 문제.','우리나라: 세계 최저 출산율, 2025년 초고령 사회 진입, 성비 불균형 완화.','인구 피라미드 유형(피라미드형·종형·방추형) 읽기.'],'저출산·고령화, 부양비, 인구 피라미드'],
  ['4일차 · 인구 문제 해결',['저출산 대책: 출산·양육 지원, 일·가정 양립, 주거 안정. 고령화 대책: 연금·노인 일자리·정년 연장.','개발 도상국: 가족 계획, 여성 교육, 경제 발전.','외국인 이주민과 다문화 사회 포용.'],'출산 장려, 다문화 사회']],
 [['1일차 · 도시의 의미와 세계 도시',['도시: 인구 밀집, 2·3차 산업 중심, 중심지 기능.','세계 도시(뉴욕·런던·도쿄): 다국적 기업 본사·금융 중심, 세계 도시 체계.','매력적인 도시 사례(생태·역사·관광 도시).'],'세계 도시, 중심지'],
  ['2일차 · 도시 내부 구조',['접근성·지대에 따라 도심(중심 업무 지구, 높은 지가·건물, 인구 공동화), 중간 지역, 주변 지역(주거·공장), 위성 도시.','도심 재개발과 젠트리피케이션.','우리 지역 도시 구조 조사.'],'도심, 인구 공동화, 위성 도시'],
  ['3일차 · 도시화 과정',['도시화율: 초기(완만) → 가속화(이촌 향도) → 종착(둔화, 역도시화).','선진국: 산업 혁명 이후 점진적. 개발 도상국: 최근 급속(과도시화, 슬럼).','우리나라: 1960~80년대 급속 도시화 → 현재 90% 이상.'],'도시화 곡선, 과도시화, 역도시화'],
  ['4일차 · 도시 문제와 살기 좋은 도시',['문제: 주택·교통·환경(열섬·쓰레기)·범죄·실업. 선진국은 도심 쇠퇴, 개발 도상국은 슬럼.','해결: 신도시·도시 재생, 대중교통, 녹지 확충, 스마트 시티.','살기 좋은 도시 조건(쿠리치바·프라이부르크 사례).'],'도시 재생, 열섬, 스마트 시티']],
 [['1일차 · 전 지구적 환경 문제',['지구 온난화(화석 연료, 온실가스) → 해수면 상승, 이상 기후, 생태계 변화.','오존층 파괴(프레온 가스), 사막화, 열대림 파괴, 산성비.','환경 문제는 국경을 넘어 국제 협력이 필요.'],'온실가스, 지구 온난화, 사막화'],
  ['2일차 · 환경 문제 해결 노력',['국제 협약: 몬트리올 의정서(오존), 교토 의정서, 파리 협정(2015, 모든 국가 감축).','탄소 중립, 신·재생 에너지, 탄소 배출권 거래.','시민·기업·정부의 역할.'],'파리 협정, 탄소 중립, 배출권'],
  ['3일차 · 환경 이슈와 지역 갈등',['환경 문제의 지역적 불평등: 전자 쓰레기 이동, 유해 산업 이전, 환경 난민.','우리나라: 미세 먼지(국내외 요인), 원전·송전탑 갈등, 쓰레기 매립.','환경 정의 개념.'],'환경 난민, 미세 먼지, 환경 정의'],
  ['4일차 · 지속 가능한 발전',['지속 가능한 발전: 환경·경제·사회의 조화, 미래 세대 고려(브룬틀란 보고서).','생활 실천: 에너지 절약, 재활용, 로컬 푸드, 생태 발자국 줄이기.','UN 지속 가능 발전 목표(SDGs 17개).'],'지속 가능한 발전, 생태 발자국, SDGs']]
],
h1:[
 [['1일차 · 인간, 사회, 환경을 보는 관점',['시간적(역사)·공간적(지리)·사회적(제도·구조)·윤리적(가치) 관점.','한 가지 관점만으로는 부족 → 통합적 관점(미세 먼지, 기후 변화 사례).','통합 사회 과목의 성격.'],'시간적 관점, 공간적 관점, 통합적 관점'],
  ['2일차 · 행복의 의미와 기준',['행복은 시대(고대: 덕·이성, 중세: 신앙, 근대: 자유·권리)와 지역(자연환경·문화)에 따라 다르다.','동양(공자의 안빈낙도, 불교의 해탈)과 서양(아리스토텔레스의 최고선, 공리주의)의 행복관.','주관적 행복과 객관적 지표(GDP, 행복 지수).'],'행복관, 행복 지수'],
  ['3일차 · 행복한 삶의 조건',['질 높은 정주 환경(안전·편의·자연), 경제적 안정(소득·분배), 민주주의(정치 참여·인권), 도덕적 실천.','부탄의 국민 총행복(GNH) 사례.','삶의 질을 높이기 위한 개인·사회의 노력.'],'정주 환경, 경제적 안정, 도덕적 실천']],
 [['1일차 · 자연환경과 인간 생활',['기후(열대·건조·온대·냉대·한대)와 지형(산지·평야·해안)에 따른 의식주·산업 차이.','자연재해의 유형과 안전하게 살 권리(헌법 34조 6항), 국가의 재해 대책.','기후 그래프·지형 사진 분석.'],'기후와 생활, 안전권'],
  ['2일차 · 자연을 보는 관점',['인간 중심주의(자연은 수단, 베이컨·데카르트) vs 생태 중심주의(자연 자체 가치, 레오폴드·네스).','두 관점의 장단점과 조화(지속 가능한 발전).','동양의 자연관(천인합일, 불교 연기설).'],'인간 중심주의, 생태 중심주의'],
  ['3일차 · 환경 문제와 해결',['지구 온난화·오존층 파괴·사막화·열대림 파괴·해양 오염의 원인과 영향.','국제 협약(파리 협정), 정부(환경 영향 평가·탄소세), 기업(ESG), 시민(녹색 소비).','우리나라 환경 문제 사례.'],'파리 협정, 환경 영향 평가, ESG']],
 [['1일차 · 산업화·도시화와 생활 공간',['산업화·도시화로 직업 분화, 핵가족, 도시적 생활 양식, 토지 이용 집약화.','문제: 주택·교통·환경, 인간 소외, 공동체 약화.','해결: 도시 재생, 녹색 교통, 공동체 회복.'],'산업화, 도시화, 인간 소외'],
  ['2일차 · 교통·통신 발달과 공간 변화',['시·공간 압축, 생활권 확대, 접근성 변화에 따른 지역 성장·쇠퇴.','긍정: 교류 확대·관광. 부정: 빨대 효과, 생태 파괴, 지역 격차.','정보화: 전자 상거래·원격 근무, 디지털 격차·사생활 침해.'],'시공간 압축, 빨대 효과, 디지털 격차'],
  ['3일차 · 지역의 변화와 지역 조사',['우리 지역의 공간 변화를 지역 조사(계획→자료 수집→분석→보고서)로 탐구.','지역 문제(쇠퇴·갈등)와 해결 방안 제안.','지역 공동체 참여.'],'지역 조사, 지역 문제']],
 [['1일차 · 인권의 의미와 확장',['인권의 특징(보편·천부·불가침·항구), 역사적 확장(시민 혁명 → 참정권 → 사회권 → 연대권).','현대의 새로운 인권: 주거권, 안전권, 환경권, 문화권, 잊힐 권리.','세계 인권 선언(1948)의 의의.'],'인권의 특징, 새로운 인권'],
  ['2일차 · 헌법과 기본권 보장',['헌법의 역할: 기본권 보장, 권력 분립, 법치주의, 복지 국가 지향.','기본권의 종류와 제한(37조 2항), 헌법재판소·법원·국가인권위원회를 통한 구제.','준법 의식과 시민 참여·시민 불복종(조건: 공익·비폭력·최후 수단·처벌 감수).'],'기본권 제한, 시민 불복종'],
  ['3일차 · 인권 문제의 양상과 해결',['국내: 사회적 소수자(장애인·이주민·성소수자·노인) 차별, 청소년 노동권 침해.','세계: 빈곤·기아, 아동 노동, 난민, 여성 차별, 정치적 박해.','해결: 적극적 우대 조치, 법·제도 개선, 국제기구(UN 인권 이사회)·NGO 활동.'],'사회적 소수자, 청소년 노동권, 적극적 우대 조치']],
 [['1일차 · 자본주의의 전개',['상업 자본주의 → 산업 자본주의(애덤 스미스, 자유방임) → 수정 자본주의(케인스, 대공황·정부 개입) → 신자유주의(하이에크, 규제 완화).','시장 경제의 장점(효율·자유)과 한계(불평등·시장 실패).','각 단계의 대표 정책 사례.'],'자유방임, 수정 자본주의, 신자유주의'],
  ['2일차 · 합리적 선택과 경제 주체',['합리적 선택: 기회비용 고려, 편익 > 비용. 한계 효용·한계 비용.','경제 주체의 역할: 가계(소비·노동), 기업(생산·사회적 책임), 정부(공공재·재분배·규제).','윤리적 소비·기업의 사회적 책임.'],'기회비용, 한계 효용, 사회적 책임'],
  ['3일차 · 국제 분업과 무역',['비교 우위(리카도)에 따른 특화와 교역 이익.','자유 무역의 이익(선택 폭, 효율)과 문제(산업 피해, 양극화). 보호 무역 수단(관세·수입 할당).','WTO·FTA와 우리나라 무역.'],'비교 우위, 관세, FTA'],
  ['4일차 · 자산 관리와 금융 설계',['자산 관리 원칙: 안전성·수익성·유동성, 분산 투자, 위험과 수익의 비례.','금융 상품: 예금·채권(안전), 주식·펀드(수익), 보험·연금(위험 대비).','생애 주기별 재무 설계(청년 저축 → 중년 자산 형성 → 노년 연금), 신용 관리.'],'분산 투자, 생애 주기, 신용']],
 [['1일차 · 정의의 의미와 기준',['정의: 각자에게 자기 몫을 주는 것. 분배 기준: 능력·업적·필요.','업적(능률, 과열 경쟁), 필요(약자 보호, 효율 저하), 능력(재능 발휘, 기회 격차)의 장단점.','절차적 정의(롤스)와 응보적 정의.'],'분배적 정의, 업적·능력·필요'],
  ['2일차 · 자유주의와 공동체주의',['자유주의 정의관(롤스: 공정한 기회·차등의 원칙, 노직: 소유 권리) vs 공동체주의(매킨타이어·샌델: 공동선·연대).','두 관점의 조화 필요.','사례(복지 확대, 병역, 세금)로 적용하기.'],'롤스, 노직, 샌델, 공동선'],
  ['3일차 · 사회 불평등과 해결',['불평등 양상: 사회 계층 양극화, 공간 불평등(수도권 집중), 사회적 약자 차별.','해결: 복지 제도(사회 보험·공공 부조·사회 서비스), 적극적 우대 조치, 지역 균형 발전, 누진세.','복지 국가의 유형과 한계(도덕적 해이·재정 부담).'],'양극화, 사회 보험, 공공 부조, 누진세']],
 [['1일차 · 문화권과 문화 변동',['문화권 구분 기준(종교·언어·의식주), 세계 문화권(동아시아·동남아·인도·건조·유럽·아메리카·오세아니아·아프리카).','점이 지대, 문화 경관(종교 건축·의복).','문화 변동 요인(발명·발견·전파)과 양상(병존·동화·융합).'],'문화권, 점이 지대, 문화 접변'],
  ['2일차 · 문화 상대주의와 보편 윤리',['자문화 중심주의·문화 사대주의의 문제, 문화 상대주의의 필요.','극단적 문화 상대주의 경계: 명예 살인·전족·순장 등은 보편 윤리(인간 존엄)로 비판 가능.','비판적 성찰의 태도.'],'문화 상대주의, 보편 윤리'],
  ['3일차 · 다문화 사회',['다문화 사회의 배경(국제결혼·이주 노동·유학), 긍정(문화 다양성·노동력)·부정(갈등·차별).','정책: 동화주의(용광로) vs 다문화주의(샐러드 볼), 우리나라의 다문화 정책.','세계 시민으로서의 태도.'],'다문화 사회, 용광로, 샐러드 볼']],
 [['1일차 · 세계화의 양상',['세계화: 국경을 넘는 상호 의존 심화(교통·통신·WTO). 지역화·세방화(글로컬).','세계 도시(뉴욕·런던·도쿄)와 다국적 기업의 공간 분업(본사-연구소-공장).','우리나라의 세계화 사례(한류, 수출).'],'세계화, 지역화, 세계 도시, 공간 분업'],
  ['2일차 · 세계화의 문제와 해결',['문제: 국가 간·계층 간 격차, 문화 획일화, 환경 문제, 노동 착취, 다국적 기업의 영향력.','해결: 공정 무역, 국제 협력, 문화 다양성 보호, 지속 가능한 발전.','세계화 찬반 토론.'],'공정 무역, 문화 획일화'],
  ['3일차 · 국제 분쟁과 평화',['분쟁 원인: 영토·자원·종교·민족(카슈미르·팔레스타인·남중국해).','소극적 평화(전쟁 없음) vs 적극적 평화(구조적 폭력 제거, 갈퉁).','평화 노력: UN·국제 사법 재판소, 시민 사회, 우리나라의 PKO·ODA, 남북 평화.'],'적극적 평화, 구조적 폭력, PKO'],
  ['4일차 · 우리나라의 영토와 평화',['영역(영토·영해·영공), 배타적 경제 수역(200해리), 독도의 지리·역사·국제법적 근거.','동아시아 역사 갈등(일본 교과서·야스쿠니, 동북공정)과 대응.','통일의 필요성(평화·경제·이산가족)과 통일 한국의 미래.'],'배타적 경제 수역, 독도, 통일']],
 [['1일차 · 세계의 인구 문제',['선진국 저출산·고령화, 개발 도상국 인구 급증, 인구 이동과 난민.','우리나라 저출산·고령화 원인과 대책(양육 지원, 일·가정 양립, 고령 친화 산업).','인구 부양비와 세대 간 형평.'],'저출산, 고령화, 부양비'],
  ['2일차 · 자원과 지속 가능한 발전',['자원의 편재성·유한성, 에너지 자원 갈등, 식량·물 문제.','지속 가능한 발전: 경제 성장·사회 통합·환경 보전의 균형, SDGs.','신·재생 에너지 전환과 순환 경제.'],'자원 갈등, SDGs, 순환 경제'],
  ['3일차 · 미래 사회와 삶의 방향',['4차 산업 혁명(AI·빅데이터·IoT)의 기회와 위협(일자리·불평등·사생활).','미래 지구촌 과제: 기후 변화, 감염병, 인권. 세계 시민 의식.','나의 미래 설계와 삶의 방향 성찰.'],'4차 산업 혁명, 세계 시민']]
],
h2:[
 [['1일차 · 고대 국가의 형성과 발전',['구석기~청동기, 고조선과 여러 나라, 삼국의 성장(중앙 집권: 율령·불교·영토 확장).','삼국 통일(676)과 통일 신라·발해(남북국), 고대 문화(불교 미술, 고분).','고대사 연표 정리.'],'중앙 집권, 남북국, 골품제'],
  ['2일차 · 고려의 성립과 변천',['고려 건국·통일, 광종·성종 체제 정비, 문벌 귀족과 무신 정권.','거란·여진·몽골과의 관계, 원 간섭기와 공민왕 개혁, 신진 사대부.','고려 문화(불교·성리학·인쇄술·청자).'],'문벌 귀족, 무신 정권, 공민왕'],
  ['3일차 · 조선의 성립과 발전',['조선 건국과 통치 체제(경국대전, 3사, 수령), 사림과 붕당, 임진왜란·병자호란.','조선 후기 변화: 탕평, 대동법, 상품 화폐 경제, 신분제 동요, 실학·서민 문화, 세도 정치.','조선 사회의 특징 비교.'],'경국대전, 붕당, 대동법, 실학'],
  ['4일차 · 전근대 한국사 종합',['왕조별 통치 체제·토지 제도·신분 제도 비교표 만들기.','주요 대외 관계와 전쟁 정리.','문화유산과 세계 유산.'],'통치 체제 비교, 토지 제도 변천']],
 [['1일차 · 서구 열강의 접근과 개항',['흥선 대원군의 내정 개혁과 통상 수교 거부(병인·신미양요).','강화도 조약(1876)과 조미 수호 통상 조약(1882, 최혜국 대우).','개화 정책 추진과 위정척사 운동.'],'통상 수교 거부, 강화도 조약, 위정척사'],
  ['2일차 · 개화·자주 운동',['임오군란(1882), 갑신정변(1884, 14개조), 거문도 사건.','동학 농민 운동(1894): 폐정 개혁안, 집강소, 반봉건·반외세.','갑오개혁·을미개혁과 을미사변·아관 파천.'],'갑신정변, 동학 농민 운동, 갑오개혁'],
  ['3일차 · 대한 제국과 국권 수호',['독립 협회(의회 설립 운동·만민 공동회), 대한 제국 광무개혁(구본신참·지계).','러일 전쟁 → 을사늑약 → 헤이그 특사 → 정미 7조약·군대 해산 → 기유각서 → 병합(1910).','항일 의병(13도 창의군·남한 대토벌), 애국 계몽 운동(보안회·신민회·국채 보상·대한매일신보).'],'광무개혁, 을사늑약, 신민회, 국채 보상 운동'],
  ['4일차 · 근대 문물과 사회 변화',['근대 시설(전차·전등·경인선·우편), 교육(원산 학사·육영 공원·소학교령), 언론(한성순보·독립신문).','신분제 폐지, 여성 교육, 국학 운동(주시경·신채호), 종교(천도교·대종교).','근대 국민 국가 수립 운동 종합 평가.'],'독립신문, 신채호, 근대 교육']],
 [['1일차 · 일제의 식민 통치',['1910년대 무단 통치(헌병 경찰, 조선 태형령, 토지 조사 사업, 회사령).','1920년대 문화 통치(기만, 친일파 양성, 산미 증식 계획, 치안 유지법).','1930년대 이후 민족 말살 통치(황국 신민 서사, 신사 참배, 창씨개명, 국가 총동원법, 징용·징병·위안부).'],'토지 조사 사업, 치안 유지법, 국가 총동원법'],
  ['2일차 · 3·1 운동과 임시 정부',['3·1 운동(1919): 배경(민족 자결·2·8 독립 선언), 전개, 의의(임시 정부 수립, 문화 통치 전환, 세계 영향).','대한민국 임시 정부: 삼권 분립·민주 공화제, 연통제·교통국, 독립 공채, 국민 대표 회의, 한인 애국단(이봉창·윤봉길), 충칭 정착·한국 광복군(1940).','건국 강령(삼균주의, 조소앙).'],'3·1 운동, 임시 정부, 한인 애국단, 삼균주의'],
  ['3일차 · 국내외 민족 운동',['국내: 실력 양성(물산 장려·민립 대학·문맹 퇴치), 사회 운동(소작·노동·형평·여성), 6·10 만세, 신간회(1927), 광주 학생 운동(1929).','국외: 봉오동·청산리 대첩(1920), 간도 참변, 자유시 참변, 3부, 의열단(김원봉), 한국 독립군·조선 혁명군, 조선 의용대, 광복군 국내 진공 작전.','민족 문화 수호(조선어 학회, 한국사 연구, 문학·예술).'],'신간회, 청산리 대첩, 의열단, 조선어 학회'],
  ['4일차 · 광복과 일제 잔재 청산 과제',['일제 강점기 수탈과 저항 종합, 강제 동원·위안부 문제의 현재.','광복(1945.8.15)의 배경: 민족 운동 + 연합국 승리(카이로·포츠담 선언).','역사 인식과 한일 관계 과제.'],'카이로 선언, 강제 동원']],
 [['1일차 · 8·15 광복과 정부 수립',['미·소 군정, 조선 건국 준비 위원회, 모스크바 3상 회의(신탁 통치 논쟁), 미소 공동 위원회 결렬.','UN 결의 → 남북 협상(김구·김규식) → 5·10 총선거 → 제헌 헌법 → 대한민국 정부 수립(1948.8.15), 북한 정권 수립.','반민 특위 활동과 좌절, 농지 개혁.'],'모스크바 3상 회의, 5·10 총선거, 반민 특위, 농지 개혁'],
  ['2일차 · 6·25 전쟁과 분단 고착',['북한 남침(1950.6.25) → UN군 참전·인천 상륙 → 중국군 개입 → 정전 협정(1953.7.27).','피해(인명·이산가족·산업 파괴)와 영향(분단 고착, 반공 체제, 한미 동맹).','전쟁의 책임과 평화의 의미.'],'인천 상륙 작전, 정전 협정, 한미 상호 방위 조약'],
  ['3일차 · 민주주의의 시련과 발전',['이승만 독재(발췌·사사오입 개헌, 3·15 부정 선거) → 4·19 혁명(1960) → 장면 내각 → 5·16 군사 정변 → 유신 체제(1972, 긴급 조치) → 부마 항쟁·10·26.','신군부 12·12 → 5·18 민주화 운동(1980) → 6월 민주 항쟁(1987, 6·29 선언, 직선제) → 평화적 정권 교체.','민주화 운동의 의의.'],'4·19 혁명, 유신 체제, 5·18, 6월 민주 항쟁'],
  ['4일차 · 경제 발전과 사회 변화',['경제 개발 5개년 계획(1962~, 수출 주도·경공업→중화학), 새마을 운동, 3저 호황, 외환 위기(1997, IMF)와 극복.','산업화의 그늘(노동 문제·전태일, 도시 문제, 환경), 복지·시민 사회 성장.','남북 관계: 7·4 남북 공동 성명(1972), 남북 기본 합의서(1991), 6·15 공동 선언(2000), 10·4 선언, 판문점 선언(2018).'],'경제 개발 계획, 외환 위기, 6·15 공동 선언']],
 [['1일차 · 냉전 체제의 형성과 전개',['미·소 대립: 트루먼 독트린, 마셜 계획, NATO vs 코민포름, 바르샤바 조약 기구.','열전: 6·25 전쟁, 베트남 전쟁, 쿠바 위기. 제3 세계의 등장(반둥 회의, 비동맹).','냉전 속 유럽 통합(EEC)과 일본 경제 성장.'],'트루먼 독트린, NATO, 비동맹'],
  ['2일차 · 아시아·아프리카의 변화',['중국: 국공 내전 → 중화 인민 공화국(1949), 대약진·문화 대혁명 → 개혁 개방.','인도·동남아·중동·아프리카 독립과 과제, 아파르트헤이트 철폐.','석유 파동과 중동 정세.'],'문화 대혁명, 개혁 개방, 석유 파동'],
  ['3일차 · 냉전의 해체와 세계화',['데탕트 → 고르바초프 개혁 → 동유럽 민주화 → 베를린 장벽 붕괴(1989) → 독일 통일 → 소련 해체(1991).','세계화: WTO(1995), EU, 신자유주의, 다국적 기업, 정보 통신 혁명.','탈냉전기 분쟁(유고 내전, 9·11, 이라크 전쟁)과 현대 세계의 과제.'],'소련 해체, WTO, 신자유주의']],
 [['1일차 · 서아시아 고대 제국',['메소포타미아·페르시아 제국(아케메네스: 다리우스 1세 왕의 길·관용, 조로아스터교), 파르티아·사산 왕조.','그리스·로마와의 교류, 동서 교역로.','헬레니즘과 서아시아.'],'아케메네스, 조로아스터교, 사산'],
  ['2일차 · 이슬람 세계의 형성',['무함마드·헤지라, 정통 칼리프·우마이야·아바스(바그다드), 수니·시아 분열.','이슬람 문화: 쿠란·오행, 학문(아비센나·이븐 할둔), 건축·미술, 아라비아 숫자.','셀주크 튀르크, 십자군, 맘루크, 티무르.'],'우마이야, 아바스, 셀주크'],
  ['3일차 · 오스만 제국과 인도',['오스만: 비잔티움 멸망(1453), 술레이만 1세, 밀레트·데브시르메, 쇠퇴와 근대화 시도.','인도: 마우리아(아소카), 굽타(힌두교), 델리 술탄, 무굴(아크바르·아우랑제브), 영국 식민화·세포이 항쟁.','이슬람·힌두 문화 융합.'],'밀레트, 무굴, 세포이 항쟁']],
 [['1일차 · 중세 유럽과 르네상스',['봉건제·장원제, 교황권, 십자군, 흑사병과 장원 해체, 백년 전쟁과 중앙 집권.','르네상스(인문주의), 종교 개혁(루터·칼뱅·영국 국교회), 30년 전쟁·베스트팔렌 조약.','근대 유럽의 토대.'],'봉건제, 르네상스, 종교 개혁'],
  ['2일차 · 신항로 개척과 절대 왕정',['포르투갈·에스파냐의 항해, 아메리카 정복과 삼각 무역, 상업 혁명·가격 혁명.','절대 왕정(루이 14세·엘리자베스 1세·표트르 대제), 중상주의, 과학 혁명(뉴턴)과 계몽사상.','아메리카 식민지 사회.'],'삼각 무역, 중상주의, 계몽사상'],
  ['3일차 · 시민 혁명과 국민 국가',['영국 혁명(권리 장전), 미국 독립(1776), 프랑스 혁명(1789, 인권 선언)과 나폴레옹, 빈 체제.','자유주의·민족주의: 7월·2월 혁명, 이탈리아·독일 통일, 미국 남북 전쟁(노예 해방).','라틴 아메리카 독립(볼리바르).'],'권리 장전, 인권 선언, 국민 국가'],
  ['4일차 · 산업 혁명과 제국주의',['산업 혁명(영국 → 유럽·미국), 사회 변화와 노동 운동·사회주의.','제국주의 침략과 식민지 분할, 제1·2차 세계 대전과 유럽의 쇠퇴.','전후 유럽 통합(EU)과 미국의 부상.'],'산업 혁명, 제국주의, 유럽 통합']],
 [['1일차 · 동아시아 세계의 성립',['황허 문명 → 춘추 전국 → 진·한 통일(군현제·유교·비단길).','위진 남북조 → 수·당(율령·3성 6부·과거·균전제), 당의 국제성.','한자·유교·불교·율령 → 동아시아 문화권(한국·일본·베트남).'],'율령 체제, 동아시아 문화권'],
  ['2일차 · 송·원과 동아시아 교류',['송의 사대부 사회·성리학·상업(교자·시박사), 요·금·서하와의 대립.','몽골 제국·원의 지배(색목인·역참), 동서 교류(마르코 폴로), 고려·일본과의 관계.','일본 가마쿠라 막부, 베트남 리·쩐 왕조.'],'성리학, 역참, 막부'],
  ['3일차 · 명·청과 에도 막부',['명(홍무제 이갑제·영락제 정화) → 청(강희·옹정·건륭, 만한 병용, 지정은제), 조공 책봉 체제.','에도 막부(산킨코타이·쇄국·조닌 문화), 조선 통신사.','은 유통과 동아시아 교역망, 서양 문물 전래.'],'조공 책봉, 지정은제, 통신사'],
  ['4일차 · 근대 동아시아의 변화',['아편 전쟁 → 양무운동 → 변법자강 → 신해혁명(1911) → 5·4 운동·국공 합작.','메이지 유신·제국주의 일본, 조선 개항과 국권 피탈.','동아시아 근현대 갈등과 화해 과제.'],'아편 전쟁, 신해혁명, 메이지 유신']]
],
h3:[
 [['1일차 · 정치와 법의 의미',['정치: 갈등 조정과 공동체 문제 해결(국가 현상설 vs 집단 현상설). 법: 강제성 있는 사회 규범.','정치와 법의 관계: 법은 정치의 결과이자 한계. 법치주의(형식적 vs 실질적).','정의와 법의 이념(합목적성·법적 안정성).'],'법치주의, 정의, 법적 안정성'],
  ['2일차 · 민주주의의 이념과 원리',['인간 존엄성, 자유·평등의 조화. 원리: 국민 주권·권력 분립·입헌주의·대의제·법치주의.','민주주의 발전사: 아테네 → 근대 시민 혁명·사회 계약설(홉스·로크·루소) → 현대 참여 민주주의.','직접 민주제 요소(국민 투표·발안·소환).'],'사회 계약설, 대의제, 국민 투표'],
  ['3일차 · 헌법의 의의와 기본 원리',['헌법: 최고법, 기본권 보장과 통치 구조 규정. 헌법 제정·개정(국회 2/3 → 국민 투표).','기본 원리: 국민 주권·자유 민주·복지 국가·국제 평화·문화 국가·평화 통일.','헌법 전문과 총강 읽기.'],'헌법 개정, 복지 국가 원리'],
  ['4일차 · 기본권의 보장과 제한',['기본권 체계: 포괄적(존엄·행복 추구), 평등권, 자유권, 참정권, 청구권, 사회권.','제한(37조 2항, 과잉 금지·본질 침해 금지), 기본권 충돌과 조정.','헌법 소원·위헌 법률 심판 사례 분석.'],'과잉 금지 원칙, 기본권 충돌']],
 [['1일차 · 정부 형태',['대통령제(미국: 엄격한 분립, 거부권, 탄핵) vs 의원 내각제(영국: 융합, 불신임·해산).','이원 집정부제(프랑스), 우리나라(대통령제 + 내각제 요소: 국무총리·법률안 제출권).','각 형태의 장단점.'],'대통령제, 의원 내각제, 이원 집정부제'],
  ['2일차 · 국회',['구성(300석, 지역구+비례), 조직(의장·상임위·교섭 단체), 회기(정기·임시).','권한: 입법(법률안 심의·의결), 재정(예산·결산·조세 법률주의), 국정 통제(감사·조사·탄핵·해임 건의·동의권).','법률 제정 절차와 대통령 거부권·재의결.'],'교섭 단체, 조세 법률주의, 재의결'],

/* --- population --- */
function simPopulation(el){
 el.innerHTML=`<div class="grid2"><div class="card"><canvas id="poC" width="520" height="300"></canvas><div class="row" id="poStats" style="margin-top:10px"></div></div>
 <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>정책·조건</h3>${ctrl('poB','합계 출산율',0.5,4,0.8,0.1,'명')}${ctrl('poL','기대 수명',60,95,83,1,'세')}${ctrl('poM','순이주(연간)',-20,50,5,1,'만 명')}${ctrl('poC2','보육 지원(출산율 보정)',0,10,0,1)}${ctrl('poH','의료 투자(수명 보정)',0,10,0,1)}${ctrl('poY','시뮬레이션 기간',10,80,50,5,'년')}
 <div class="row"><button class="sm" data-s="kr">한국형</button><button class="sm" data-s="ng">나이지리아형</button><button class="sm" data-s="jp">일본형</button><button class="sm" data-s="pyr">피라미드 보기</button></div></div></div>`;
 const cv=$('#poC'),c=cv.getContext('2d');let mode='line';
 const v=id=>+$('#'+id).value;
 function run(){const b=v('poB')+v('poC2')*.08,life=v('poL')+v('poH')*.6,mig=v('poM'),yrs=v('poY');
  let age=Array(100).fill(0);for(let a=0;a<100;a++)age[a]=a<20?60:a<65?75:Math.max(0,60-(a-65)*2.5);
  const hist=[];let young=0,old=0,tot=0;
  for(let y=0;y<=yrs;y++){tot=age.reduce((a,b)=>a+b,0);young=age.slice(0,15).reduce((a,b)=>a+b,0);old=age.slice(65).reduce((a,b)=>a+b,0);hist.push([tot,young,old]);
   const women=age.slice(20,45).reduce((a,b)=>a+b,0)/2;const births=women*b/25;const next=Array(100).fill(0);next[0]=births;for(let a=0;a<99;a++){const surv=a<life-10?.998:a<life?.96:.75;next[a+1]=age[a]*surv}for(let a=20;a<40;a++)next[a]+=mig/20;age=next}
  const st=getComputedStyle(document.documentElement),fg=st.getPropertyValue('--fg').trim(),mu=st.getPropertyValue('--muted').trim();
  c.clearRect(0,0,cv.width,cv.height);c.font='12px sans-serif';
  if(mode==='line'){const mx=Math.max(...hist.map(h=>h[0]))*1.1,W=cv.width,H=cv.height;const X=i=>40+i/yrs*(W-60),Y=t=>H-30-t/mx*(H-50);
   [[0,'#1f5fd6','총인구'],[1,'#0e9f8a','유소년'],[2,'#d9822b','노년']].forEach(([k,col,nm],i)=>{c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();hist.forEach((h,j)=>j?c.lineTo(X(j),Y(h[k])):c.moveTo(X(j),Y(h[k])));c.stroke();c.fillStyle=col;c.fillText(nm,60+i*80,16)});
   c.fillStyle=mu;c.fillText('0년',40,H-10);c.fillText(yrs+'년',W-50,H-10);c.fillText(Math.round(mx)+'만',2,30)}
  else{const mx=Math.max(...age)*1.05,W=cv.width,H=cv.height,cx=W/2;c.fillStyle=mu;c.fillText('남',cx-60,14);c.fillText('여',cx+40,14);for(let a=0;a<100;a+=5){const s=age.slice(a,a+5).reduce((x,y)=>x+y,0)/5;const w=s/mx*(W/2-40);const y=H-20-a/100*(H-40);c.fillStyle=a<15?'#0e9f8a':a<65?'#1f5fd6':'#d9822b';c.fillRect(cx-w-1,y-6,w,5);c.fillRect(cx+1,y-6,w,5);if(a%20===0){c.fillStyle=mu;c.fillText(a+'세',cx-16,y-8)}}}
  const dep=((young+old)/(tot-young-old)*100);$('#poStats').innerHTML=[[yrs+'년 후 총인구',Math.round(tot)+'만'],['노년 비율',(old/tot*100).toFixed(1)+'%'],['유소년 비율',(young/tot*100).toFixed(1)+'%'],['총부양비',dep.toFixed(0)],['사회 유형',old/tot>.2?'초고령':old/tot>.14?'고령':old/tot>.07?'고령화':'젊은 사회']].map(s=>`<div class="stat"><b class="num" style="font-size:16px">${s[1]}</b><span>${s[0]}</span></div>`).join('')}
 bindRanges(el,run);
 const set=(id,x)=>{$('#'+id).value=x;$('#'+id+'v').textContent=x};
 $$('[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s;if(s==='pyr'){mode=mode==='line'?'pyr':'line';b.textContent=mode==='line'?'피라미드 보기':'추이 그래프 보기'}if(s==='kr'){set('poB',0.8);set('poL',83);set('poM',5)}if(s==='ng'){set('poB',4);set('poL',60);set('poM',-5)}if(s==='jp'){set('poB',1.3);set('poL',85);set('poM',2)}run()});
 run();
 featList(el,['연령별 코호트 모델(100세)','합계 출산율 조절','기대 수명 조절','순이주 조절','보육 지원 정책 효과','의료 투자 효과','기간 10~80년','총인구 추이 그래프','유소년·노년 추이','인구 피라미드','총부양비 계산','고령화 단계 판정','한국형 프리셋','나이지리아형 프리셋','일본형 프리셋','노년·유소년 비율']);
}

/* --- climate --- */
function simClimate(el){
 el.innerHTML=`<div class="grid2"><div class="card"><canvas id="clC" width="520" height="280"></canvas><div class="row" id="clStats" style="margin-top:10px"></div><div id="clLife" style="font-size:14px;margin-top:8px"></div></div>
 <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>지리 조건</h3>${ctrl('clLat','위도',0,80,37,1,'°')}${ctrl('clAlt','고도',0,4000,50,50,'m')}${ctrl('clSea','해안 거리',0,2000,30,10,'km')}${ctrl('clCur','난류(+)/한류(-) 영향',-5,5,0,1)}${ctrl('clMon','계절풍 강도',0,10,6,1)}
 <label style="font-size:13px"><input type="checkbox" id="clSouth"> 남반구</label>
 <div class="row"><button class="sm" data-c="seoul">서울</button><button class="sm" data-c="sing">싱가포르</button><button class="sm" data-c="cairo">카이로</button><button class="sm" data-c="london">런던</button><button class="sm" data-c="moscow">모스크바</button><button class="sm" data-c="lhasa">라싸</button></div></div></div>`;
 const cv=$('#clC'),c=cv.getContext('2d');const v=id=>+$('#'+id).value;
 function run(){const lat=v('clLat'),alt=v('clAlt'),sea=v('clSea'),cur=v('clCur'),mon=v('clMon'),south=$('#clSouth').checked;
  const base=30-lat*0.55-alt*0.0065+cur;const range=(4+lat*0.35)*(0.5+Math.min(sea,1500)/1500*0.8);
  const T=[],P=[];
  for(let m=0;m<12;m++){T[m]=base+(range/2)*Math.cos((m-(south?0.5:6.5))/12*2*Math.PI)*-1;let p=lat<10?180:lat<25?(Math.abs(m-(south?0:6))<3?150:20):lat<60?70:25;p*=Math.max(.15,1-sea/2500);if(mon>0&&lat>20&&lat<45)p+=(Math.abs(m-(south?0.5:6.5))<2.5?mon*18:-mon*3);if(lat>=20&&lat<=32&&sea>150)p*=.25;P.push(Math.max(2,p))}
  const tmin=Math.min(...T),tmax=Math.max(...T),pt=P.reduce((a,b)=>a+b,0),tm=T.reduce((a,b)=>a+b,0)/12;
  let k,life;if(pt<300&&tm>5){k='건조(사막·스텝)';life='흙벽돌집, 오아시스 농업, 유목'}else if(tmin>=18){k=pt>1500?'열대 우림':'사바나';life='고상 가옥, 플랜테이션, 이동식 화전 농업'}else if(tmin>-3){k=tmax>22?'온대(온난 습윤)':'온대(서안 해양성)';life='벼농사·밀농사, 밀집 거주'}else if(tmax>10){k='냉대';life='통나무집, 침엽수림(타이가), 임업'}else{k=tmax>0?'한대(툰드라)':'한대(빙설)';life='이끼·순록 유목, 영구 동토층'}
  if(alt>2500)k+=' · 고산 기후';
  const st=getComputedStyle(document.documentElement),mu=st.getPropertyValue('--muted').trim();const W=cv.width,H=cv.height;c.clearRect(0,0,W,H);c.font='12px sans-serif';
  const bw=(W-70)/12;P.forEach((p,m)=>{c.fillStyle='#1f5fd6';const h=Math.min(H-60,p/300*(H-60));c.fillRect(40+m*bw+4,H-30-h,bw-8,h);c.fillStyle=mu;c.fillText((m+1)+'월',40+m*bw+6,H-14)});
  c.strokeStyle='#c9353d';c.lineWidth=3;c.beginPath();T.forEach((t,m)=>{const y=H-30-(t+30)/70*(H-60);m?c.lineTo(40+m*bw+bw/2,y):c.moveTo(40+m*bw+bw/2,y)});c.stroke();
  c.fillStyle='#c9353d';c.fillText('기온(℃) -30~40',44,16);c.fillStyle='#1f5fd6';c.fillText('강수(mm) 0~300',200,16);
  $('#clStats').innerHTML=[['기후 구분',k],['연평균 기온',tm.toFixed(1)+'℃'],['연교차',(tmax-tmin).toFixed(1)+'℃'],['연강수량',Math.round(pt)+'mm']].map(s=>`<div class="stat"><b style="font-size:15px">${s[1]}</b><span>${s[0]}</span></div>`).join('');
  $('#clLife').innerHTML='<b>예상 생활 양식:</b> '+life}
 bindRanges(el,run);$('#clSouth').onchange=run;
 const set=(id,x)=>{$('#'+id).value=x;$('#'+id+'v').textContent=x};
 const P={seoul:[37,50,30,0,6,0],sing:[1,20,5,2,2,0],cairo:[30,20,150,0,0,0],london:[51,20,60,4,0,0],moscow:[56,150,900,0,0,0],lhasa:[30,3650,1500,0,3,0]};
 $$('[data-c]').forEach(b=>b.onclick=()=>{const p=P[b.dataset.c];['clLat','clAlt','clSea','clCur','clMon'].forEach((id,i)=>set(id,p[i]));$('#clSouth').checked=!!p[5];run()});
 run();
 featList(el,['위도 조절','고도 조절(기온 감률)','해안 거리(대륙도)','난류·한류 효과','계절풍 강도','남반구 전환(계절 반전)','월별 기온 곡선','월별 강수 막대','쾨펜식 기후 분류 추정','연평균 기온','연교차','연강수량','생활 양식 추정','고산 기후 판정','6개 도시 프리셋']);
}

/* --- trial --- */
function simTrial(el){
 const cases=[
  {t:'자전거 충돌 사건',s:'A가 인도에서 자전거를 빠르게 타다 보행자 B와 부딪혀 B가 다쳤다. A는 "B가 갑자기 튀어나왔다"고 주장한다.',ev:[['CCTV 영상','A가 시속 25km로 인도 주행','a'],['목격자 진술','B가 스마트폰을 보며 걷고 있었다','b'],['병원 진단서','B 전치 3주','a'],['자전거 도로 표지','해당 인도는 자전거 통행 금지','a']],laws:[['민법 750조(불법 행위 손해 배상)',true],['형법 250조(살인)',false],['도로교통법(자전거 인도 통행 금지)',true],['민법 396조(과실 상계)',true]],answer:'A의 책임이 크지만 B의 과실도 일부 인정해 손해 배상액을 줄이는 과실 상계가 적절하다.'},
  {t:'온라인 명예 훼손 사건',s:'C가 SNS에 같은 반 D에 대한 허위 소문을 올려 많은 사람이 보았다. C는 "장난이었다"고 한다.',ev:[['게시글 캡처','허위 내용과 D의 실명 포함','a'],['조회 수 기록','1,200회 조회','a'],['C의 메시지','"걔 좀 골탕 먹이려고"','a'],['D의 진술','전학을 고민 중','a']],laws:[['정보통신망법(사이버 명예 훼손)',true],['민법 751조(정신적 손해 배상)',true],['헌법 21조(표현의 자유) 절대 보장',false],['형법 307조(명예 훼손)',true]],answer:'허위 사실 유포에 의한 명예 훼손이 성립한다. 표현의 자유는 타인의 명예를 침해하지 않는 범위에서 보장된다.'},
  {t:'중고 거래 사기 의심 사건',s:'E는 F에게 게임기를 팔기로 하고 돈을 받았으나 물건을 보내지 않았다. E는 "택배가 분실됐다"고 주장한다.',ev:[['송금 내역','F가 15만 원 송금','a'],['택배 조회','송장 번호 존재하지 않음','a'],['E의 다른 거래','같은 수법 3건 신고','a'],['E의 계좌','당일 전액 출금','a']],laws:[['형법 347조(사기)',true],['민법 390조(채무 불이행)',true],['형법 329조(절도)',false],['전자상거래법(청약 철회)',false]],answer:'거짓 송장과 반복 수법으로 보아 처음부터 속일 의도가 있었으므로 사기죄 성립. 민사상 대금 반환 책임도 있다.'},
  {t:'학교 체육복 사건(미성년 계약)',s:'만 15세 G가 부모 동의 없이 온라인에서 20만 원짜리 운동화를 할부로 샀다. 부모가 계약 취소를 요구한다.',ev:[['주문 내역','G 명의, 본인 인증','a'],['G의 나이','만 15세','a'],['판매자 약관','"환불 불가" 표시','b'],['부모 진술','동의한 적 없음','a']],laws:[['민법 5조(미성년자 법률 행위 취소)',true],['민법 141조(취소의 효과)',true],['약관 규제법(불공정 약관 무효)',true],['형법 329조(절도)',false]],answer:'법정 대리인 동의 없는 미성년자의 계약은 취소할 수 있으며, "환불 불가" 약관으로 이를 막을 수 없다.'}];
 let ci=rnd(cases.length),role='judge',found=[],picked=[],pts=0;
 function draw(){const cs=cases[ci];el.innerHTML=`<div class="grid2"><div class="card"><div class="row between"><div><div class="eyebrow">사건 ${ci+1}/${cases.length}</div><h3>${cs.t}</h3></div><div class="row"><select id="trRole"><option value="judge">판사</option><option value="pros">검사</option><option value="def">변호인</option><option value="jury">배심원</option></select><button class="sm" id="trNext">다른 사건</button></div></div>
  <p style="margin:8px 0 12px">${cs.s}</p><div class="eyebrow">증거 조사 (클릭해서 공개)</div><div class="opts" style="margin:6px 0 12px">${cs.ev.map((e,i)=>`<button data-e="${i}" ${found.includes(i)?'disabled':''}>${found.includes(i)?'<b>'+e[0]+'</b><br><span style="font-size:13px">'+e[1]+'</span>':'🔍 '+e[0]}</button>`).join('')}</div>
  <div class="eyebrow">적용할 법 조항 선택</div><div class="opts" style="margin:6px 0 12px">${cs.laws.map((l,i)=>`<button data-l="${i}" class="${picked.includes(i)?'act':''}">${l[0]}</button>`).join('')}</div>
  <div class="row"><select id="trVerdict"><option value="g">유죄/책임 인정</option><option value="p">일부 책임 (과실 상계)</option><option value="n">무죄/책임 없음</option></select><input type="number" id="trPen" placeholder="배상액(만원)/형량" style="width:140px"><button class="pri" id="trJudge">판결 선고</button></div>
  <div id="trRes" style="margin-top:12px"></div></div>
  <div class="card"><h3>재판 기록</h3><div class="row" style="margin:8px 0"><div class="stat"><b class="num">${pts}</b><span>누적 점수</span></div><div class="stat"><b class="num">${found.length}/${cs.ev.length}</b><span>증거 확보</span></div></div>
  <div class="eyebrow">역할 안내</div><p style="font-size:13px;color:var(--muted)">${{judge:'판사: 증거와 법 조항을 종합해 공정한 판결을 내립니다.',pros:'검사: 피고의 책임을 입증할 증거를 모읍니다.',def:'변호인: 피고에게 유리한 증거와 조항을 찾습니다.',jury:'배심원: 상식과 증거로 유·무죄 의견을 냅니다.'}[role]}</p>
  <div class="eyebrow">삼권 분립 체크</div><p style="font-size:13px;color:var(--muted)">법을 만드는 곳(입법) · 집행하는 곳(행정) · 판단하는 곳(사법)이 분리되어 있어야 공정한 재판이 가능합니다.</p>
  <div class="row"><button class="sm" id="trHint">힌트</button><button class="sm" id="trReset">사건 초기화</button></div></div></div>`;
  $('#trRole').value=role;$('#trRole').onchange=e=>{role=e.target.value;draw()};
  $$('[data-e]').forEach(b=>b.onclick=()=>{found.push(+b.dataset.e);draw()});
  $$('[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;picked=picked.includes(i)?picked.filter(x=>x!==i):[...picked,i];draw()});
  $('#trNext').onclick=()=>{ci=(ci+1)%cases.length;found=[];picked=[];draw()};
  $('#trReset').onclick=()=>{found=[];picked=[];draw()};
  $('#trHint').onclick=()=>toast('증거 ' +cs.ev.length+'개를 모두 확인하고, 사건과 관련 없는 조항은 빼세요');
  $('#trJudge').onclick=()=>{const good=cs.laws.map((l,i)=>l[1]?i:-1).filter(i=>i>=0);const hit=picked.filter(i=>good.includes(i)).length,wrong=picked.filter(i=>!good.includes(i)).length;const v=$('#trVerdict').value;const expect=ci===0||ci===3?'p':'g';const vs=v===expect?20:v==='n'?0:10;const sc=found.length*5+hit*10-wrong*10+vs;pts+=Math.max(0,sc);

 const idx=(x,y)=>y*N+x,adj=i=>{const x=i%N,y=(i/N)|0;return [[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[x+a,y+b]).filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N).map(([a,b])=>idx(a,b))};
 const near=(i,t,r=2)=>{const x=i%N,y=(i/N)|0;for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++){const X=x+a,Y=y+b;if(X>=0&&X<N&&Y>=0&&Y<N&&g[idx(X,Y)]===t)return true}return false};
 function calc(){const cnt=t=>g.filter(c=>c===t).length;let pop=0,jobs=cnt('com')*40+cnt('ind')*70,happy=0,n=0,heat=0,pol=0;
  g.forEach((c,i)=>{if(c==='res'){const road=adj(i).some(j=>g[j]==='road');const p=road?50:15;pop+=p;let h=50+(near(i,'park')?15:0)+(near(i,'school',3)?10:0)+(near(i,'hosp',3)?10:0)-(near(i,'ind')?25:0)-(road?0:20)+(near(i,'com')?5:0);happy+=h;n++}
   if(c==='ind'){pol+=1;heat+=1.5}if(c==='com')heat+=1;if(c==='res')heat+=.6;if(c==='park'){heat-=1.5}if(c==='road')heat+=.5});
  const built=g.filter(Boolean).length||1;const heatIdx=Math.max(0,Math.round(heat/built*30));const unemp=pop?Math.max(0,Math.round((pop-jobs)/pop*100)):0;const avgH=n?Math.round(happy/n):0;
  const roads=g.filter(c=>c==='road').length;const traffic=pop?Math.min(100,Math.round(pop/Math.max(1,roads)/12)):0;
  const issues=[];if(unemp>30)issues.push(['bad','일자리 부족 → 실업률 '+unemp+'%']);if(pop>jobs*1.6&&pop>200)issues.push(['warn','베드타운화: 주거는 많고 일자리는 적음']);if(heatIdx>45)issues.push(['bad','열섬 현상 심각 (공원 부족)']);if(traffic>60)issues.push(['warn','교통 체증: 도로를 늘리세요']);if(g.some((c,i)=>c==='res'&&near(i,'ind')))issues.push(['warn','공업 지역 인접 주거: 환경 민원']);if(cnt('res')>6&&!cnt('school'))issues.push(['warn','학교가 없음']);if(cnt('res')>8&&!cnt('hosp'))issues.push(['warn','병원이 없음']);if(!issues.length&&pop>0)issues.push(['good','균형 잡힌 도시입니다']);
  const score=Math.round(pop/10+avgH*2-heatIdx-traffic/2-pol*3);return{pop,jobs,unemp,avgH,heatIdx,traffic,pol,issues,score,cnt}}
 function draw(){const r=calc();el.innerHTML=`<div class="grid2"><div class="card"><div class="row" style="margin-bottom:8px">${T.map(t=>`<button class="sm ${tool===t[0]?'act':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="map" id="ctMap" style="grid-template-columns:repeat(${N},1fr)">${g.map((c,i)=>{const t=T.find(x=>x[0]===c);return `<div data-i="${i}" style="background:${t?t[2]:'var(--panel2)'}" title="${t?t[1]:'빈 땅'}">${t?t[1].slice(0,2):''}</div>`}).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="sm" data-p="grid">격자형 신도시</button><button class="sm" data-p="sprawl">무계획 확산</button><button class="sm" data-p="green">전원 도시</button><button class="sm" id="ctClear">모두 지우기</button><button class="sm" id="ctUndo">되돌리기</button></div></div>
  <div class="card"><h3>📊 도시 진단</h3><div class="row" style="margin:8px 0">${[['인구',r.pop+'명'],['일자리',r.jobs],['실업률',r.unemp+'%'],['행복도',r.avgH],['열섬 지수',r.heatIdx],['교통 혼잡',r.traffic],['도시 점수',r.score]].map(x=>`<div class="stat"><b class="num" style="font-size:18px">${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
  <div style="display:flex;flex-direction:column;gap:6px">${r.issues.map(i=>`<span class="pill ${i[0]}">${i[1]}</span>`).join('')}</div>
  <p style="font-size:13px;color:var(--muted);margin-top:12px">주거는 도로에 붙어야 인구가 늘고, 공원이 가까우면 행복·열섬이 좋아지며, 공업 옆 주거는 민원이 생깁니다. 상업·공업이 일자리를 만듭니다.</p></div></div>`;
  $$('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;draw()});
  $$('#ctMap div').forEach(d=>d.onclick=()=>{hist.push([...g]);g[+d.dataset.i]=tool==='del'?null:tool;draw()});
  $('#ctClear').onclick=()=>{hist.push([...g]);g.fill(null);draw()};$('#ctUndo').onclick=()=>{if(hist.length){g=hist.pop();draw()}};
  $$('[data-p]').forEach(b=>b.onclick=()=>{hist.push([...g]);g.fill(null);const p=b.dataset.p;
   if(p==='grid'){for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(y%3===1||x===4)g[idx(x,y)]='road';else if(x<4)g[idx(x,y)]=y<3?'com':'res';else g[idx(x,y)]=y>6?'ind':'res'}g[idx(2,4)]='park';g[idx(6,4)]='park';g[idx(1,1)]='school';g[idx(7,1)]='hosp'}
   if(p==='sprawl'){for(let i=0;i<N*N;i++)g[i]=Math.random()<.55?['res','res','res','com','ind','road'][rnd(6)]:null}
   if(p==='green'){for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(y%2===1)g[idx(x,y)]='road';else g[idx(x,y)]=x%3===1?'park':'res'}g[idx(0,0)]='com';g[idx(8,0)]='com';g[idx(4,8)]='school';g[idx(8,8)]='hosp'}
   draw()})}
 draw();
 featList(el,['9×9 격자 도시','주거·상업·공업·공원·도로·학교·병원 7종 배치','지우기 도구','인구 계산(도로 접근)','일자리·실업률','행복도(공원·학교·병원·공해 반영)','열섬 지수','교통 혼잡도','공해 지수','도시 문제 자동 진단 7종','도시 점수','격자형 신도시 프리셋','무계획 확산 프리셋','전원 도시 프리셋','되돌리기','모두 지우기']);
}

/* --- silkroad --- */
function simSilkroad(el){
 const CITIES=[['장안',0],['둔황',14],['사마르칸트',30],['바그다드',24],['콘스탄티노플',22]];
 const GOODS=['비단','도자기','차','향신료','유리','말'];
 const BASE=[[30,40,20,120,110,60],[45,55,30,100,95,50],[80,90,55,60,70,40],[130,140,90,35,45,55],[180,200,120,50,30,70]];
 let city=0,day=0,gold=500,cargo=Array(6).fill(0),cap=20,price=[],log=[],over=false,hist=[500];

  <p style="font-size:12px;color:var(--muted);margin:8px 0 0">동쪽 상품(비단·도자기·차)은 서쪽으로 갈수록, 서쪽 상품(향신료·유리)은 동쪽으로 갈수록 비싸집니다.</p></div>
  <div class="card"><h3>🗺️ 이동</h3><div class="row" style="margin:8px 0">${CITIES.map((c,i)=>`<button class="sm ${i===city?'act':''}" data-m="${i}" ${over||i===city?'disabled':''}>${c[0]} ${i!==city?'('+Math.abs(i-city)*18+'일)':''}</button>`).join('')}</div>
  <div class="row"><button class="sm" id="srCap" ${over||gold<200?'disabled':''}>낙타 추가 (+10짐, 200금)</button><button class="sm" id="srReset">새 여정</button></div>
  <canvas id="srC" width="420" height="140" style="margin-top:10px"></canvas>
  <div class="log" style="margin-top:10px">${log.slice(-8).map(l=>`<div>${l}</div>`).join('')}</div></div></div>`;
  $$('[data-b]').forEach(b=>b.onclick=()=>{const i=+b.dataset.b;if(gold>=price[i]&&used<cap){gold-=price[i];cargo[i]++;draw()}else toast(gold<price[i]?'금화가 부족합니다':'짐이 가득 찼습니다')});
  $$('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(cargo[i]){gold+=price[i];cargo[i]--;draw()}});
  $$('[data-m]').forEach(b=>b.onclick=()=>move(+b.dataset.m));$('#srCap').onclick=()=>{gold-=200;cap+=10;draw()};$('#srReset').onclick=()=>simSilkroad(el);
  const cv=$('#srC'),c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);const mx=Math.max(...hist)*1.1;c.strokeStyle='#fbbf24';c.lineWidth=2.5;c.beginPath();hist.forEach((h,i)=>{const x=10+i/Math.max(1,hist.length-1)*400,y=130-h/mx*120;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle='#9aa8c7';c.font='11px sans-serif';c.fillText('자산 추이',12,12)}
 function move(to){const d=Math.abs(to-city)*18;day+=d;city=to;const r=Math.random();

  roll();hist.push(gold+cargo.reduce((a,c,i)=>a+c*price[i],0));if(day>=120){over=true;const v=gold+cargo.reduce((a,c,i)=>a+c*price[i],0);log.push(`⏳ 120일이 지났다. 최종 자산 ${v}금화 (출발 500). ${v>1500?'전설의 대상인! 🏆':v>900?'훌륭한 상인':'다음엔 시세 차이를 더 노려보자'}`)}draw()}
 roll();draw();
 featList(el,['5개 도시(장안~콘스탄티노플)','6종 교역품','도시별 기본 물가 + 매번 ±25% 변동','싸다/비싸다 표시','사고팔기','짐 용량 제한','낙타 추가 구매','이동 일수 계산','도적·모래폭풍·선물·상품 손상 이벤트','120일 제한','자산 추이 그래프','최종 평가 3단계','여정 로그','새 여정']);

/* --- lawmaking --- */
function simLawmaking(el){
 const CLAUSES=[['학생 1인당 무상 교육비 확대',{a:.8,b:.5,c:.3},'예산 부담 큼'],['청소년 야간 노동 전면 금지',{a:.7,b:.6,c:.4},'노동권 보호'],['전동 킥보드 헬멧 의무화',{a:.6,b:.7,c:.6},'안전'],['SNS 악성 댓글 처벌 강화',{a:.5,b:.6,c:.7},'표현의 자유 쟁점'],['플라스틱 빨대 사용 금지',{a:.8,b:.4,c:.2},'환경 vs 자영업'],['학교 체육 시간 주 3회 보장',{a:.6,b:.6,c:.5},'건강'],['급식 지역 농산물 50% 의무',{a:.7,b:.5,c:.6},'농촌 표'],['인터넷 실명제 도입',{a:.2,b:.5,c:.8},'위헌 소지 큼(2012 위헌 결정 선례)']];
 const PARTIES=[['A당(진보)',120,'a'],['B당(중도)',100,'b'],['C당(보수)',80,'c']];
 let picked=[],stage=0,log=[],result=null,title='';
 function draw(){el.innerHTML=`<div class="grid2"><div class="card"><h3>📜 법안 만들기</h3><div class="row" style="margin:8px 0"><input type="text" id="lmTitle" placeholder="법안 이름 (예: 청소년 건강 증진법)" value="${title}" style="flex:1"></div>
  <div class="eyebrow">조항 선택 (최대 4개)</div><div style="display:flex;flex-direction:column;gap:6px;margin:6px 0 10px">${CLAUSES.map((c,i)=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--panel2)"><input type="checkbox" data-cl="${i}" ${picked.includes(i)?'checked':''} ${stage>0?'disabled':''}><span style="flex:1">${c[0]}</span><span class="pill" style="font-size:11px">${c[2]}</span></label>`).join('')}</div>
  <div class="row"><button class="pri" id="lmGo" ${stage>0?'disabled':''}>국회에 발의</button><button class="sm" id="lmReset">새 법안</button></div>
  <div class="eyebrow" style="margin-top:12px">국회 구성 (300석)</div><div class="row">${PARTIES.map(p=>`<span class="pill">${p[0]} ${p[1]}석</span>`).join('')}</div></div>
  <div class="card"><h3>🏛️ 입법 과정</h3><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${['① 발의 (의원 10인 이상)','② 상임 위원회 심사','③ 법제사법위원회 체계·자구 심사','④ 본회의 표결 (재적 과반 출석, 출석 과반 찬성)','⑤ 정부 이송 → 대통령 공포 또는 거부권(15일)','⑥ 재의결 (재적 과반 출석, 출석 2/3 찬성)','⑦ 헌법재판소 위헌 심판 가능'].map((t,i)=>`<div style="padding:8px 12px;border-radius:10px;background:${i<stage?'color-mix(in srgb,var(--good) 20%,var(--panel2))':i===stage&&stage>0?'color-mix(in srgb,var(--accent) 25%,var(--panel2))':'var(--panel2)'};font-size:13px">${t}</div>`).join('')}</div>
  <div class="log" style="margin-top:10px">${log.map(l=>`<div>${l}</div>`).join('')||'<div>법안을 발의하면 과정이 시작됩니다.</div>'}</div>
  ${stage>0&&stage<7&&!result?`<div class="row" style="margin-top:10px"><button class="pri" id="lmNext">다음 단계 →</button></div>`:''}${result?`<div class="card soft" style="margin-top:10px"><b>${result}</b></div>`:''}</div></div>`;
  $('#lmTitle').oninput=e=>title=e.target.value;$$('[data-cl]').forEach(c=>c.onchange=()=>{picked=$$('[data-cl]:checked').map(x=>+x.dataset.cl);if(picked.length>4){c.checked=false;picked=picked.filter(x=>x!==+c.dataset.cl);toast('조항은 4개까지')}});
  $('#lmGo').onclick=()=>{if(!picked.length){toast('조항을 1개 이상 고르세요');return}stage=1;log.push(`「${title||'이름 없는 법안'}」 발의 (조항 ${picked.length}개).`);draw()};
  $('#lmReset').onclick=()=>simLawmaking(el);const nx=$('#lmNext');if(nx)nx.onclick=step}
 const support=k=>picked.reduce((a,i)=>a+CLAUSES[i][1][k],0)/picked.length;
 function vote(th){const y=PARTIES.map(p=>{const s=support(p[2]);return Math.round(p[1]*Math.min(1,Math.max(0,s+(Math.random()-.5)*.2)))});const tot=y.reduce((a,b)=>a+b,0);return{y,tot,pass:tot>=300*th}}
 function step(){
  if(stage===1){stage=2;const ok=Math.random()<.85;log.push(ok?'상임위에서 공청회를 거쳐 수정·가결했다.':'상임위에서 계류되어 시간이 걸렸다.');if(!ok){stage=1;}}
  else if(stage===2){stage=3;const un=picked.some(i=>CLAUSES[i][2].includes('위헌'));log.push(un?'법사위가 위헌 소지 조항에 수정 의견을 달았다.':'법사위 체계·자구 심사 통과.')}
  else if(stage===3){const v=vote(.5);stage=4;log.push(`본회의 표결: ${v.y.map((n,i)=>PARTIES[i][0].split('(')[0]+' '+n).join(', ')} → 찬성 ${v.tot}/300`);if(!v.pass){result='❌ 본회의 부결. 법안이 폐기되었다. 지지가 넓은 조항으로 다시 구성해 보자.';stage=7}}
  else if(stage===4){stage=5;const veto=support('c')<.4&&Math.random()<.6;if(veto)log.push('🛑 대통령이 거부권을 행사해 국회로 돌려보냈다.');else{log.push('✅ 대통령이 15일 안에 공포했다. 법률 성립!');stage=6;const un=picked.some(i=>CLAUSES[i][2].includes('위헌'));result=un?'⚖️ 시행 후 헌법재판소가 인터넷 실명제 조항을 위헌 결정(표현의 자유 침해). 나머지 조항만 효력 유지.':'🎉 법률이 시행되었다! 국회 → 대통령 → 공포, 3권의 역할을 모두 거쳤다.';stage=7}}
  else if(stage===5){const v=vote(2/3);stage=6;log.push(`재의결: 찬성 ${v.tot}/300 (2/3 = 200 필요)`);if(v.pass){log.push('✅ 재의결 통과 — 대통령 거부권을 넘어 법률 확정.');result='🎉 재의결로 법률 확정! 거부권도 국회 2/3 앞에서는 힘을 잃는다.'}else result='❌ 재의결 실패. 법안 폐기. 거부권은 강력한 견제 수단이다.';stage=7}
  draw()}
 draw();
 featList(el,['법안 이름 짓기','8개 조항 중 선택(최대 4)','조항별 정당 지지도','3당 300석 국회','7단계 입법 절차 표시','상임위 공청회·계류','법사위 체계·자구 심사','본회의 표결(출석 과반)','정당별 표 분포','대통령 거부권','재의결(2/3)','헌법재판소 위헌 결정(실명제 선례)','결과 평가','새 법안']);
}

/* --- central bank --- */
function simCentralbank(el){
 let q=1,rate=3,infl=3,unemp=3.5,growth=2.5,log=[],hist=[],over=false,score=0,shock=null;
 const SH=[['국제 유가 급등',()=>{infl+=2;growth-=1}],['수출 호황',()=>{growth+=2;infl+=.8}],['부동산 거품 붕괴',()=>{growth-=2.5;unemp+=1.5;infl-=1}],['감염병 확산',()=>{growth-=3;unemp+=2;infl-=.5}],['정부 재정 확대',()=>{growth+=1.5;infl+=1}],['환율 급등(원화 약세)',()=>{infl+=1.2}]];
 function draw(){el.innerHTML=`<div class="grid2"><div class="card"><div class="row between"><h3>🏦 ${Math.ceil(q/4)}년 ${(q-1)%4+1}분기</h3><span class="pill">점수 ${score}${over?' · 임기 종료':''}</span></div>
  <div class="row" style="margin:8px 0">${[['물가 상승률',infl.toFixed(1)+'%',infl>4||infl<0?'var(--bad)':infl>3?'var(--warn)':'var(--good)'],['실업률',unemp.toFixed(1)+'%',unemp>5?'var(--bad)':unemp>4?'var(--warn)':'var(--good)'],['성장률',growth.toFixed(1)+'%',growth<0?'var(--bad)':growth<1.5?'var(--warn)':'var(--good)'],['기준 금리',rate.toFixed(2)+'%','var(--fg)']].map(x=>`<div class="stat"><b class="num" style="color:${x[2]}">${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
  <canvas id="cbC" width="460" height="200"></canvas><div class="log" style="margin-top:10px">${log.slice(-6).map(l=>`<div>${l}</div>`).join('')}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>이번 분기 금리 결정</h3>${shock?`<div class="card soft">⚡ ${shock}</div>`:''}
  <div class="row">${[-0.5,-0.25,0,0.25,0.5].map(d=>`<button class="${d===0?'':'sm'}" data-d="${d}" ${over?'disabled':''} style="flex:1">${d>0?'+':''}${d===0?'동결':d.toFixed(2)+'%p'}</button>`).join('')}</div>
  <p style="font-size:13px;color:var(--muted);margin:0">목표: 물가 2% 안팎, 실업률 4% 이하, 성장률 2% 이상. 금리를 올리면 물가는 잡히지만 성장·고용이 식고, 내리면 반대. 효과는 2~3분기 뒤에 나타납니다(시차).</p>
  <div class="row"><button class="sm" id="cbReset">새 임기</button></div></div></div>`;
  $$('[data-d]').forEach(b=>b.onclick=()=>step(+b.dataset.d));$('#cbReset').onclick=()=>simCentralbank(el);
  const cv=$('#cbC'),c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);c.font='11px sans-serif';if(hist.length>1){[[0,'#fb7185','물가'],[1,'#fbbf24','실업'],[2,'#34d399','성장'],[3,'#a78bfa','금리']].forEach(([k,col,nm],j)=>{c.strokeStyle=col;c.lineWidth=2;c.beginPath();hist.forEach((h,i)=>{const x=30+i/19*420,y=190-(h[k]+3)/12*170;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.fillStyle=col;c.fillText(nm,40+j*60,12)});c.strokeStyle='#64748b';c.setLineDash([3,3]);c.beginPath();c.moveTo(30,190-5/12*170);c.lineTo(450,190-5/12*170);c.stroke();c.setLineDash([]);c.fillStyle='#9aa8c7';c.fillText('2%',6,190-5/12*170+4)}}
 const pipeline=[];
 function step(d){if(over)return;rate=Math.max(0,Math.min(10,rate+d));pipeline.push(d);if(pipeline.length>2){const eff=pipeline.shift();infl-=eff*1.6;growth-=eff*1.4;unemp+=eff*.9}
  const gap=rate-3;infl+=(growth-2)*.15-gap*.1+(Math.random()-.5)*.4;growth+=(2.5-growth)*.2-gap*.08+(Math.random()-.5)*.5;unemp+=(growth<1?.4:growth>3?-.3:0)+(Math.random()-.5)*.2;unemp=Math.max(2,unemp);
  shock=null;if(Math.random()<.3){const s=SH[rnd(SH.length)];s[1]();shock=s[0];log.push(`${q}분기: ⚡ ${s[0]}`)}
  const pts=Math.max(0,10-Math.abs(infl-2)*2-Math.max(0,unemp-4)*2-Math.max(0,2-growth)*2);score+=Math.round(pts);hist.push([infl,unemp,growth,rate]);
  if(infl>8){log.push('💥 하이퍼인플레이션 위기! 신뢰가 무너졌다.')}if(growth<-3)log.push('💥 심각한 경기 침체.');q++;if(q>20){over=true;log.push(`🏁 5년 임기 종료. 점수 ${score}/200 — ${score>150?'명총재! 🏆':score>100?'무난한 운영':'경제가 롤러코스터였다'}`)}draw()}
 draw();
 featList(el,['20분기(5년) 진행','기준 금리 ±0.25/0.5 결정','금리 효과 2분기 시차','물가·실업·성장 상호 작용 모델','6종 외부 충격(유가·감염병·거품 붕괴 등)','목표 달성 점수','하이퍼인플레이션 경고','침체 경고','4지표 추이 그래프','2% 목표선','임기 평가 3단계']);
}

/* --- imjin --- */
function simImjin(el){
 const Y=[[1592,'4월 부산 상륙, 20일 만에 한양 함락. 선조 의주 피란. 한산도 대첩(7월).'],[1593,'평양성 탈환(조·명 연합), 행주 대첩, 진주성 2차 전투, 강화 교섭 시작.'],[1594,'휴전 교섭기. 훈련도감 설치, 속오군 편성.'],[1595,'교섭 지속. 왜군은 남해안에 왜성을 쌓고 주둔.'],[1596,'교섭 결렬 조짐. 이순신 모함과 파직(1597 초).'],[1597,'정유재란. 칠천량 패전 → 명량 대첩(13척).'],[1598,'도요토미 사망, 왜군 철수. 노량 해전(11월), 이순신 전사. 전쟁 종결.']];
 let i=0,navy=40,army=30,militia=30,diplo=20,morale=50,land=70,log=[],over=false;
 function draw(){const y=Y[i];el.innerHTML=`<div class="grid2"><div class="card"><div class="row between"><h3>⚔️ ${y?y[0]:1598}년</h3><span class="pill">${over?'전쟁 종결':'조선 영토 '+land+'%'}</span></div><p style="margin:6px 0 10px;font-size:14px">${y?y[1]:''}</p>
  <div style="display:flex;flex-direction:column;gap:8px">${[['수군(판옥선·거북선)',navy,'var(--p1)'],['관군·훈련도감',army,'var(--accent2)'],['의병·승병',militia,'var(--good)'],['명과의 외교',diplo,'var(--amber)'],['민심',morale,'var(--coral)']].map(b=>`<div><div class="row between" style="font-size:13px"><span>${b[0]}</span><b class="num">${Math.round(b[1])}</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,b[1]))}%;background:${b[2]}"></i></div></div>`).join('')}</div>
  <div class="log" style="margin-top:10px">${log.slice(-7).map(l=>`<div>${l}</div>`).join('')}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>올해 조정의 결정 (자원 100 배분)</h3>${ctrl('imN','수군 지원',0,100,35,5)}${ctrl('imA','관군 재건·훈련도감',0,100,25,5)}${ctrl('imM','의병 지원·포상',0,100,20,5)}${ctrl('imD','명에 원군 요청·외교',0,100,20,5)}
  <label style="font-size:13px"><input type="checkbox" id="imTax"> 전시 특별 징수 (자원 +30, 민심 -15)</label>
  <button class="pri" id="imNext" ${over?'disabled':''}>1년 진행 →</button><button class="sm" id="imReset">1592년부터</button>
  <p style="font-size:12px;color:var(--muted)">수군은 보급로를 끊고(제해권), 의병은 후방을 흔들며, 명군은 평양을 되찾지만 교섭을 길게 끕니다. 1597년엔 수군이 약하면 칠천량의 비극이 반복됩니다.</p></div></div>`;
  $('#imNext').onclick=step;$('#imReset').onclick=()=>simImjin(el)}
 function step(){let n=+$('#imN').value,a=+$('#imA').value,m=+$('#imM').value,d=+$('#imD').value;const t=n+a+m+d||1;const extra=$('#imTax').checked?1.3:1;n=n/t*100*extra;a=a/t*100*extra;m=m/t*100*extra;d=d/t*100*extra;if($('#imTax').checked)morale-=15;
  navy+=n*.5-10;army+=a*.45-8;militia+=m*.5-8+(morale>50?5:-5);diplo+=d*.5-6;const yr=Y[i][0];let msg=[];
  if(yr===1592){if(navy>45){land+=5;msg.push('한산도 대첩! 제해권 확보, 왜군 보급 차단')}else{land-=15;msg.push('남해 제해권을 잃어 왜군이 전라도로 진격')}if(militia>35)msg.push('곽재우·조헌 등 의병이 봉기해 후방을 교란');land-=30}
  if(yr===1593){if(diplo>30){land+=20;msg.push('명군과 평양성 탈환')}else{land+=5;msg.push('명군 파병이 늦어 전선이 교착')}if(army>35){land+=8;msg.push('행주 대첩 승리(권율)')}}
  if(yr===1594||yr===1595){if(diplo>40)msg.push('강화 교섭으로 전투가 줄었지만 왜군은 남해안에 남았다');if(army>45)msg.push('훈련도감·속오군으로 군 체제 재정비');land+=5}
  if(yr===1596){if(morale<40){msg.push('이몽학의 난 등 민란 발생');army-=8}}
  if(yr===1597){if(navy<40){navy=10;land-=20;msg.push('💥 칠천량 패전으로 수군이 궤멸했다')}else msg.push('수군이 보존되어 명량에서 대승(13척 vs 133척)');land-=5}
  if(yr===1598){msg.push('도요토미 사망으로 왜군 철수. 노량 해전에서 이순신 전사.');if(navy>50)land+=10}
  morale+=(land>60?3:-5)+(militia>40?2:0);land=Math.max(0,Math.min(100,land));[navy,army,militia,diplo,morale]=[navy,army,militia,diplo,morale].map(x=>Math.max(0,Math.min(100,x)));
  log.push(`${yr}년: ${msg.join('. ')||'큰 변화 없이 한 해가 지났다'}.`);i++;

function gameLand(el){const N=6;let board=Array(N*N).fill(0),turn=1,pool=shuffle(poolQuiz(G().id)),qi=0,cur=null,phase='q',score=[0,0];board[7]=1;board[28]=2;

let race=null;
function stopRace(){if(race){clearInterval(race.iv);race=null}}
function renderRace(el){
 const lb=store.get('lb',[]);
 el.innerHTML=`<div class="card"><div class="row between"><div><div class="eyebrow">🏁 역사 레이스</div><h3>빠르게 맞혀 먼저 결승선 통과</h3></div>
